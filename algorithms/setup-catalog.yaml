# Per JCA engine type: the paths it applies (`variants`, default [fixed, notFixed]), the key it generates (`generates`), and what a fixed call still does per call (operation | initAndOperation, or byMode / bySuffix choosing one); notFixed is getInstance + init + operation.
# Source: each engine's JCA API contract; read by settings EngineRows (config entry/EngineCatalog, preparation operation/SetupCatalog load it); documented in apps/benchmark/modules/preparation/docs/operations.md#variants.
schemaVersion: 1
engines:
  MessageDigest: {fixed: operation, contract: "digest() resets the digest for further use"}
  Mac:
    contract: "doFinal() resets the Mac to its state after init(key); a GMAC nonce must not repeat under one key"
    # GMAC follows its IV role's lifetime (perUse, rule unique), not lifecycle.reset: an afterInit reset would repeat the nonce
    fixed: bySuffix
    suffixes:
      GMAC: initAndOperation
    otherSuffix: operation
  Signature: {fixed: operation, contract: "sign() and verify() reset the object to its state after initSign or initVerify"}
  KeyAgreement: {fixed: operation, contract: "generateSecret() resets the object to its state after init"}
  KeyGenerator: {variants: [fixed, secure], generates: secretKey, contract: "generateKey() is the measured work; init once by the case"}
  KeyPairGenerator: {variants: [fixed, secure], generates: keyPair, contract: "generateKeyPair() is the measured work; initialize once by the case"}
  Cipher:
    contract: "doFinal() resets the cipher to its state after init; an IV or nonce must not repeat under one key"
    fixed: byMode
    modes:
      ECB: operation
      NONE: operation
      CBC: initAndOperation
      PCBC: initAndOperation
      CTS: initAndOperation
      CFB: initAndOperation
      OFB: initAndOperation
      CTR: initAndOperation
      GCM: initAndOperation
      CCM: initAndOperation
    # a transformation without a mode: a stream cipher or the provider's default mode; the initialised cipher's IV decides
    withoutMode: {iv: initAndOperation, noIv: operation}
    otherMode: initAndOperation
