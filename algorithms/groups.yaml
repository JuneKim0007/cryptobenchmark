# The predefined groups: per family its exemplars, chosen to show its range; its members are the entries of algorithms/<family>_catalogue.yaml
# (groups.py); every word: glossary.yaml. Contract rows come from those entries' contracts: only a pair in one row can swap without a change.
# An id with no contract, such as OAEP, goes to the model.
schemaVersion: 4
source: exemplars chosen by hand; members are the family catalogues' entries
groups:
  agreement.peer:
    exemplars:
    - KeyAgreement|ECDH
    - KeyAgreement|X25519
    - KeyAgreement|DiffieHellman
  cipher.pair:
    exemplars:
    - Cipher|RSA/ECB/PKCS1Padding
    - Cipher|ECIES
    - Cipher|SM2
  cipher.secret:
    exemplars:
    - Cipher|AES/GCM/NoPadding
    - Cipher|AES/CBC/PKCS5Padding
    - Cipher|ChaCha20-Poly1305
    - Cipher|PBEWITHSHA256AND256BITAES-CBC-BC
  digest.none:
    exemplars:
    - MessageDigest|SHA-256
    - MessageDigest|SHA3-256
    - MessageDigest|MD5
  keygen.none:
    exemplars:
    - KeyGenerator|AES
    - KeyGenerator|HmacSHA256
    - KeyGenerator|ChaCha20
  keypairgen.none:
    exemplars:
    - KeyPairGenerator|EC
    - KeyPairGenerator|RSA
    - KeyPairGenerator|Ed25519
    - KeyPairGenerator|ML-DSA-65
  mac.secret:
    exemplars:
    - Mac|HmacSHA256
    - Mac|HmacSHA3-256
    - Mac|AESCMAC
    - Mac|AES-GMAC
    - Mac|PBEWithHmacSHA256
  signature.pair:
    exemplars:
    - Signature|SHA256withECDSA
    - Signature|SHA256withRSA/PSS
    - Signature|Ed25519
    - Signature|ML-DSA-65
  # outside the families: a name a person or the higher model could not place; no contract, so never a candidate
  unidentified:
    exemplars: []
    algorithms: []
