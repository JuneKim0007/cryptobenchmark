    names: [Cipher|ECIESwithAES-CBC, Cipher|ECIESwithDESEDE-CBC, Cipher|ECIESwithSHA256andAES-CBC, Cipher|ECIESwithSHA256andDESEDE-CBC, Cipher|ECIESwithSHA384andAES-CBC, Cipher|ECIESwithSHA384andDESEDE-CBC, Cipher|ECIESwithSHA512andAES-CBC, Cipher|ECIESwithSHA512andDESEDE-CBC]
