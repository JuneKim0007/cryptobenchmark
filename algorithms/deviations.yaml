# Facts shared by a set of names and builds, each stated once; every word: catalog/glossary.yaml deviation. An entry's own `providers` wins over these.
schemaVersion: 1
deviations:
  conscrypt.pbeHmacRunsAesCbc:
    fact: "These names run as AES/CBC/PKCS5Padding on a raw key: a spelling of the plain cipher, so no salt or count reaches them, and a key from a factory of the name reaches AES as its raw bytes, so a password of another length is refused."
    builds: [AndroidOpenSSL, BundledConscrypt]
    names: [Cipher|PBEWithHmacSHA1AndAES_128, Cipher|PBEWithHmacSHA1AndAES_256, Cipher|PBEWithHmacSHA224AndAES_128, Cipher|PBEWithHmacSHA224AndAES_256, Cipher|PBEWithHmacSHA256AndAES_128, Cipher|PBEWithHmacSHA256AndAES_256, Cipher|PBEWithHmacSHA384AndAES_128, Cipher|PBEWithHmacSHA384AndAES_256, Cipher|PBEWithHmacSHA512AndAES_128, Cipher|PBEWithHmacSHA512AndAES_256]
    set: {conditions.output.formula: 'pad:16', contract.input: {passwordBased: false, wrap: false}, contract.key: app, contract.output: {base: AES, mode: CBC, padding: PKCS5Padding}, key.origin: app, key.type: AES, required.iterationCount: null, required.iv: {name: iv, recipe: jca.ivSpec, bytes: 16, rule: unpredictable, use: decrypt, passedTo: init, source: measured}, required.password: null, required.salt: null}
  conscrypt.pbeHmacAes128KeyBytes:
    fact: "The AES_128 names of the alias above take a 16-byte key."
    builds: [AndroidOpenSSL, BundledConscrypt]
    names: [Cipher|PBEWithHmacSHA1AndAES_128, Cipher|PBEWithHmacSHA224AndAES_128, Cipher|PBEWithHmacSHA256AndAES_128, Cipher|PBEWithHmacSHA384AndAES_128, Cipher|PBEWithHmacSHA512AndAES_128]
    set: {key.bytes: [16], required.secretKey: {name: secretKey, bytes: 16, passedTo: init, source: measured}}
  conscrypt.pbeHmacAes256KeyBytes:
    fact: "The AES_256 names of the alias above take a 32-byte key."
    builds: [AndroidOpenSSL, BundledConscrypt]
    names: [Cipher|PBEWithHmacSHA1AndAES_256, Cipher|PBEWithHmacSHA224AndAES_256, Cipher|PBEWithHmacSHA256AndAES_256, Cipher|PBEWithHmacSHA384AndAES_256, Cipher|PBEWithHmacSHA512AndAES_256]
    set: {key.bytes: [32], required.secretKey: {name: secretKey, bytes: 32, passedTo: init, source: measured}}
  conscrypt.gcmSivEncryptsOnce:
    fact: "Conscrypt refuses a second encryption under one key and nonce for GCM-SIV as for GCM, though GCM-SIV resists nonce misuse: the forward engine needs a new init."
    builds: [AndroidOpenSSL @ android-30, AndroidOpenSSL @ android-33, AndroidOpenSSL @ android-36, BundledConscrypt]
    names: [Cipher|AES/GCM-SIV/NoPadding]
    set: {lifecycle.reset.forward: {value: none, source: measured}}
  bc.pbeIterationCount:
    fact: "These PBE names need an iteration count in PBEParameterSpec for encrypting too; a JDK's takes it only to decrypt."
    builds: [BC @ android-26, BC @ android-30, BC @ android-33, BC @ jdk-25, BundledBC]
    names: [Cipher|PBEWithMD5AndDES, Cipher|PBEWithSHA1AndDESede, Cipher|PBEWithSHA1AndRC2_128, Cipher|PBEWithSHA1AndRC2_40]
    set: {required.iterationCount: {name: iterationCount, recipe: jca.pbeSpec, value: 1000, passedTo: init, source: measured}}
  bc.deterministicRsaAndRc4:
    fact: "These names give equal outputs for equal inputs on BC; SunJCE's differ."
    builds: [BC, BundledBC]
    names: [Cipher|PBEWithSHA1AndRC4_128, Cipher|PBEWithSHA1AndRC4_40, Cipher|RSA]
    set: {conditions.deterministic: {value: always, source: measured}}
  bc.eciesCurve:
    fact: "BC 1.79 ran these ECIES names on a key of secp256r1."
