buildscript {
    ext.versions = [
            kotlin: '2.2.21',
            // AGP 8 uses a Gradle internal API removed in 9.6: the wrapper stays on 9.5.
            agp: '8.13.2',
    ]
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${versions.agp}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${versions.kotlin}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
