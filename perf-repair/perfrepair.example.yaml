# Copy to perfrepair.yaml (git-ignored) or point --perfrepair-config / PERFREPAIR_CONFIG at a copy.
# Every key is optional; a missing or null key falls through to the next layer:
#   CLI flag > environment (PERFREPAIR_*) > this file > .env > code default.
# A role key (grouping.assign, grouping.supervisor, guide.agent, ai.*) beats every agent.* layer,
# environment included; only a CLI flag beats a role key.
# Relative paths resolve against this file's folder. Secrets (API keys, tokens) are refused here:
# keep ANTHROPIC_API_KEY in the environment or .env.

agent:                     # every model-calling command
  backend: claude-code     # claude-code | claude | dry-run      (PERFREPAIR_AGENT)
  model: claude-opus-5-5   #                                     (PERFREPAIR_MODEL)
  effort: medium           # low | medium | high | xhigh | max   (PERFREPAIR_EFFORT)
  claudeBinary: claude     # the `claude` CLI the claude-code backend runs

paths:
  run:                     # default --run of grouping assign/report, ai, guide
  results:                 # default --results of guide
  prompts:                 # default --prompts of every model-calling command

grouping:
  turns: 3
  sessions: 2
  limit:                   # items per `grouping assign` call; empty = all
  assign: {}               # role keys: backend, model, effort, claudeBinary
  supervisor:
    effort: high           # the code default for `grouping report --supervisor`

guide:
  mode: latency            # latency | battery
  limit:
  device: false
  config:                  # cryptobenchmark global.yaml for the device step
  agent: {}

ai:
  worthiness: {}
  replace: {}

screening:                 # checked but not read by any command yet
  catalog:
  unknown: model           # model | unverified
