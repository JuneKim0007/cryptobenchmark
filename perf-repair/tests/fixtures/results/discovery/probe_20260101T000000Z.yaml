schemaVersion: 1
capturedAtMillis: 1
runtime: {model: test, sdkInt: 36}
providers:
- name: Fast
  version: '1.0'
  precedence: 1
  usable: true
  services:
  - {type: Cipher, algorithm: AES/GCM/NoPadding, className: a.A}
  - {type: MessageDigest, algorithm: SHA-256, className: a.B, aliases: [SHA256]}
- name: Slow
  version: '1.0'
  precedence: 2
  usable: true
  services:
  - {type: Cipher, algorithm: AES/GCM/NoPadding, className: b.A}
  - {type: Mac, algorithm: HmacSHA256, className: b.C}
