# Policy as data: what counts as improving, and how confidence is graded. Read by modes.py criteria().
improvingRatio: 0.97        # to / from at or below this counts as improving; smaller gains are not worth an app change
levels:                     # the first level whose atLeast pImprove reaches; a level grades, it never rejects
  - {name: ok, atLeast: 0.95}
  - {name: warn, atLeast: 0.8}
  - {name: weak, atLeast: 0.0}
# one rule for every perfMode; a metric worsens at or above 1 / improvingRatio, the summary's own `worse` line
rule: improves when at least one selected metric improves and none worsens
