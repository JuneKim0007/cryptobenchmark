    DES: []
    DESede: [TripleDES]
    RSA: []
    ARCFOUR: [RC4, ARC4]
    Blowfish: []
    ChaCha20: []
    ChaCha20-Poly1305: [ChaCha20/Poly1305/NoPadding]
    RC2: []
    DESedeWrap: []
    # JDK's AESWrap and AESWrapPad are aliases of these transformations (standard names, JDK 17).
    AES/KW/NoPadding: [AESWrap]
    AES/KWP/NoPadding: [AESWrapPad]
    PBEWithMD5AndDES: []
    PBEWithSHA1AndDES: []
    PBEWithMD5AndTripleDES: []
    PBEWithMD5AndRC2: []
    PBEWithSHA1AndRC2: []
    # PKCS#12 PBE (RFC 7292 Appendix C): the JDK and BouncyCastle spellings name one OID each.
    PBEWithSHA1AndDESede: [PBEWITHSHAAND3-KEYTRIPLEDES-CBC]
    PBEWITHSHAAND2-KEYTRIPLEDES-CBC: []
    PBEWithSHA1AndRC2_128: [PBEWITHSHAAND128BITRC2-CBC]
    PBEWithSHA1AndRC2_40: [PBEWITHSHAAND40BITRC2-CBC]
    PBEWithSHA1AndRC4_128: [PBEWITHSHAAND128BITRC4]
    PBEWithSHA1AndRC4_40: [PBEWITHSHAAND40BITRC4]
    PBEWITHSHAAND128BITAES-CBC-BC: [PBEWITHSHA1AND128BITAES-CBC-BC, PBEWITHSHA-1AND128BITAES-CBC-BC]
    PBEWITHSHAAND192BITAES-CBC-BC: [PBEWITHSHA1AND192BITAES-CBC-BC, PBEWITHSHA-1AND192BITAES-CBC-BC]
    PBEWITHSHAAND256BITAES-CBC-BC: [PBEWITHSHA1AND256BITAES-CBC-BC, PBEWITHSHA-1AND256BITAES-CBC-BC]
    PBEWITHSHA256AND128BITAES-CBC-BC: []
    PBEWITHSHA256AND192BITAES-CBC-BC: []
    PBEWITHSHA256AND256BITAES-CBC-BC: []
    PBEWITHMD5AND128BITAES-CBC-OPENSSL: []
    PBEWITHMD5AND192BITAES-CBC-OPENSSL: []
    PBEWITHMD5AND256BITAES-CBC-OPENSSL: []
    PBEWITHSHAANDTWOFISH-CBC: []
    PBEWithHmacSHA1AndAES_128: []
    PBEWithHmacSHA1AndAES_256: []
    PBEWithHmacSHA224AndAES_128: []
    PBEWithHmacSHA224AndAES_256: []
    PBEWithHmacSHA256AndAES_128: []
    PBEWithHmacSHA256AndAES_256: []
    PBEWithHmacSHA384AndAES_128: []
    PBEWithHmacSHA384AndAES_256: []
    PBEWithHmacSHA512AndAES_128: []
    PBEWithHmacSHA512AndAES_256: []
    PBEWithHmacSHA512/224AndAES_128: []
    PBEWithHmacSHA512/224AndAES_256: []
    PBEWithHmacSHA512/256AndAES_128: []
    PBEWithHmacSHA512/256AndAES_256: []
  SecretKeyFactory:
    AES: []
    DESede: [TripleDES]
    PBKDF2WithHmacSHA1: []
    PBKDF2WithHmacSHA256: []
    PBKDF2WithHmacSHA512: []
    PBEWITHSHAAND128BITAES-CBC-BC: [PBEWITHSHA1AND128BITAES-CBC-BC, PBEWITHSHA-1AND128BITAES-CBC-BC]
    PBEWITHSHAAND192BITAES-CBC-BC: [PBEWITHSHA1AND192BITAES-CBC-BC, PBEWITHSHA-1AND192BITAES-CBC-BC]
    PBEWITHSHAAND256BITAES-CBC-BC: [PBEWITHSHA1AND256BITAES-CBC-BC, PBEWITHSHA-1AND256BITAES-CBC-BC]
  KeyGenerator:
    AES: [Rijndael]
    DESede: [TripleDES]
    DES: []
    Blowfish: []
    RC2: []
    ARCFOUR: [RC4, ARC4]
    ChaCha20: []
    HmacMD5: [HMAC-MD5, HMAC/MD5]
    HmacSHA1: [HMAC-SHA1, HMAC/SHA1]
    HmacSHA224: [HMAC-SHA224, HMAC/SHA224]
    HmacSHA256: [HMAC-SHA256, HMAC/SHA256]
    HmacSHA384: [HMAC-SHA384, HMAC/SHA384]
    HmacSHA512: [HMAC-SHA512, HMAC/SHA512]
    HmacSHA512/224: []
    HmacSHA512/256: []
    HmacSHA3-224: []
    HmacSHA3-256: []
    HmacSHA3-384: []
    HmacSHA3-512: []
    SunTlsPrf: []
    SunTls12Prf: []
    SunTlsMasterSecret: []
    SunTlsKeyMaterial: []
    SunTlsRsaPremasterSecret: []
  KeyPairGenerator:
    RSA: []
    RSASSA-PSS: []
    EC: []
    DSA: []
    DiffieHellman: [DH]
    XDH: []
    X25519: []
    X448: []
    Ed25519: []
    Ed448: []
    EdDSA: []
    ML-DSA: []
    ML-DSA-44: []
    ML-DSA-65: []
    ML-DSA-87: []
    ML-KEM: []
    ML-KEM-512: []
    ML-KEM-768: []
