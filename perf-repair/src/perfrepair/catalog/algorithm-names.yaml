# Canonical algorithm names per engine type; every spelling matches case-insensitively.
# Names only: resolved parameters (OAEP digest, MGF1 digest, provider defaults) are never folded here.
# Sources: JDK Standard Algorithm Names (docs.oracle.com/en/java/javase/17/docs/specs/security/standard-names.html),
# Conscrypt OpenSSLProvider aliases (github.com/google/conscrypt), BouncyCastle provider aliases (bouncycastle.org).
schemaVersion: 1
names:
  MessageDigest:
    MD2: []
    MD5: []
    SHA-1: [SHA1, SHA]
    SHA-224: [SHA224]
    SHA-256: [SHA256]
    SHA-384: [SHA384]
    SHA-512: [SHA512]
    SHA-512/224: [SHA512/224]
    SHA-512/256: [SHA512/256]
    SHA3-224: []
    SHA3-256: []
    SHA3-384: []
    SHA3-512: []
    GOST3411: [GOST, GOST-3411]
  Mac:
    HmacMD5: [HMAC-MD5, HMAC/MD5]
    HmacSHA1: [HMAC-SHA1, HMAC/SHA1]
    HmacSHA224: [HMAC-SHA224, HMAC/SHA224]
    HmacSHA256: [HMAC-SHA256, HMAC/SHA256]
    HmacSHA384: [HMAC-SHA384, HMAC/SHA384]
    HmacSHA512: [HMAC-SHA512, HMAC/SHA512]
  Signature:
    NONEwithRSA: []
    MD5withRSA: [MD5/RSA, MD5withRSAEncryption]
    SHA1withRSA: [SHA1/RSA, SHA-1/RSA, SHA1withRSAEncryption]
    SHA224withRSA: [SHA224/RSA, SHA224withRSAEncryption]
    SHA256withRSA: [SHA256/RSA, SHA256withRSAEncryption]
    SHA384withRSA: [SHA384/RSA, SHA384withRSAEncryption]
    SHA512withRSA: [SHA512/RSA, SHA512withRSAEncryption]
    SHA1withRSA/PSS: [SHA1withRSAandMGF1]
    SHA256withRSA/PSS: [SHA256withRSAandMGF1]
    RSASSA-PSS: []
    NONEwithECDSA: []
    SHA1withECDSA: [ECDSA, ECDSAwithSHA1]
    SHA224withECDSA: [SHA224/ECDSA]
    SHA256withECDSA: [SHA256/ECDSA]
    SHA384withECDSA: [SHA384/ECDSA]
    SHA512withECDSA: [SHA512/ECDSA]
    NONEwithDSA: [RAWDSA]
    SHA1withDSA: [DSA, SHA/DSA, DSAwithSHA1]
    SHA256withDSA: [SHA256/DSA]
    Ed25519: []
  Cipher:
    AES: [Rijndael]
    DES: []
    DESede: [TripleDES]
    RSA: []
    ARCFOUR: [RC4, ARC4]
    Blowfish: []
    ChaCha20: []
    ChaCha20-Poly1305: [ChaCha20/Poly1305/NoPadding]
    PBEWITHSHAAND128BITAES-CBC-BC: [PBEWITHSHA1AND128BITAES-CBC-BC, PBEWITHSHA-1AND128BITAES-CBC-BC]
    PBEWITHSHAAND192BITAES-CBC-BC: [PBEWITHSHA1AND192BITAES-CBC-BC, PBEWITHSHA-1AND192BITAES-CBC-BC]
    PBEWITHSHAAND256BITAES-CBC-BC: [PBEWITHSHA1AND256BITAES-CBC-BC, PBEWITHSHA-1AND256BITAES-CBC-BC]
  SecretKeyFactory:
    AES: []
    DESede: [TripleDES]
    PBKDF2WithHmacSHA1: []
    PBKDF2WithHmacSHA256: []
    PBKDF2WithHmacSHA512: []
    PBEWITHSHAAND128BITAES-CBC-BC: [PBEWITHSHA1AND128BITAES-CBC-BC, PBEWITHSHA-1AND128BITAES-CBC-BC]
    PBEWITHSHAAND192BITAES-CBC-BC: [PBEWITHSHA1AND192BITAES-CBC-BC, PBEWITHSHA-1AND192BITAES-CBC-BC]
    PBEWITHSHAAND256BITAES-CBC-BC: [PBEWITHSHA1AND256BITAES-CBC-BC, PBEWITHSHA-1AND256BITAES-CBC-BC]
  KeyGenerator:
    AES: [Rijndael]
    DESede: [TripleDES]
    ARCFOUR: [RC4, ARC4]
    ChaCha20: []
    HmacMD5: [HMAC-MD5, HMAC/MD5]
    HmacSHA1: [HMAC-SHA1, HMAC/SHA1]
    HmacSHA224: [HMAC-SHA224, HMAC/SHA224]
    HmacSHA256: [HMAC-SHA256, HMAC/SHA256]
    HmacSHA384: [HMAC-SHA384, HMAC/SHA384]
    HmacSHA512: [HMAC-SHA512, HMAC/SHA512]
  KeyPairGenerator:
    RSA: []
    EC: []
    DSA: []
    DiffieHellman: [DH]
    XDH: []
    X25519: []
    Ed25519: []
    EdDSA: []
  KeyFactory:
    RSA: []
    EC: []
    DSA: []
    DiffieHellman: [DH]
    XDH: []
    X25519: []
    ECGOST3410: [GOST-3410-2001, ECGOST-3410]
  KeyAgreement:
    ECDH: []
    DiffieHellman: [DH]
    XDH: []
    X25519: []
  SecureRandom:
    SHA1PRNG: []
    NativePRNG: []
    DRBG: []
  KeyStore:
    AndroidKeyStore: []
    BKS: []
    BCFKS: []
    JKS: []
    PKCS12: []
# A key-size suffix is a separate fact: AES_256 is AES with a 256-bit key constraint (Conscrypt, SunJCE).
sized:
  Cipher:
    AES_128: {name: AES, keySize: 128}
    AES_192: {name: AES, keySize: 192}
    AES_256: {name: AES, keySize: 256}
# Transformation engines: a name not listed above is algorithm/mode/padding, each part canonicalised.
transformations:
  Cipher:
    modes: [NONE, ECB, CBC, CFB, CFB8, CFB128, OFB, OFB8, OFB128, CTR, CTS, GCM, GCM-SIV, CCM, KW, KWP, PCBC]
    paddings: [NoPadding, PKCS1Padding, PKCS5Padding, ISO10126Padding, SSL3Padding, OAEPPadding,
               OAEPWithSHA-1AndMGF1Padding, OAEPWithSHA-224AndMGF1Padding, OAEPWithSHA-256AndMGF1Padding,
               OAEPWithSHA-384AndMGF1Padding, OAEPWithSHA-512AndMGF1Padding,
               OAEPWithSHA-512/224AndMGF1Padding, OAEPWithSHA-512/256AndMGF1Padding]
    # PKCS#7 padding equals PKCS#5 padding for these block ciphers (RFC 5652 6.3); Conscrypt aliases them.
    paddingSynonyms:
      AES: {PKCS7Padding: PKCS5Padding}
      DESede: {PKCS7Padding: PKCS5Padding}
    # RSA is one block: Conscrypt and BouncyCastle register RSA/None/* as aliases of RSA/ECB/*.
    modeSynonyms:
      RSA: {NONE: ECB}
keyFormats: [RAW, PKCS#8, X.509]
