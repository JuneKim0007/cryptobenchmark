# Canonical algorithm names per engine type; every spelling matches case-insensitively.
# Names only: resolved parameters (OAEP digest, MGF1 digest, provider defaults) are never folded here.
# Sources: JDK Standard Algorithm Names (docs.oracle.com/en/java/javase/17/docs/specs/security/standard-names.html),
# Conscrypt OpenSSLProvider aliases (github.com/google/conscrypt), BouncyCastle provider aliases (bouncycastle.org).
schemaVersion: 1
names:
  MessageDigest:
    MD2: []
    MD5: []
    SHA-1: [SHA1, SHA]
    SHA-224: [SHA224]
    SHA-256: [SHA256]
    SHA-384: [SHA384]
    SHA-512: [SHA512]
    SHA-512/224: [SHA512/224]
    SHA-512/256: [SHA512/256]
    SHA3-224: []
    SHA3-256: []
    SHA3-384: []
    SHA3-512: []
    GOST3411: [GOST, GOST-3411]
    SHAKE128-256: []
    SHAKE256-512: []
  Mac:
    HmacMD5: [HMAC-MD5, HMAC/MD5]
    HmacSHA1: [HMAC-SHA1, HMAC/SHA1]
    HmacSHA224: [HMAC-SHA224, HMAC/SHA224]
    HmacSHA256: [HMAC-SHA256, HMAC/SHA256]
    HmacSHA384: [HMAC-SHA384, HMAC/SHA384]
    HmacSHA512: [HMAC-SHA512, HMAC/SHA512]
    HmacSHA512/224: []
    HmacSHA512/256: []
    HmacSHA3-224: []
    HmacSHA3-256: []
    HmacSHA3-384: []
    HmacSHA3-512: []
    AESCMAC: []
    SslMacMD5: []
    SslMacSHA1: []
    # PKCS#12 and PBE MACs are password-based, never raw HMAC. One BC service registers PBEWITHHMACSHA beside
    # PBEWITHHMACSHA1, so they stay two rows; an alias makes config's duplicate_name refuse that provider.
    HmacPBESHA1: []
    HmacPBESHA224: []
    HmacPBESHA256: []
    HmacPBESHA384: []
    HmacPBESHA512: []
    HmacPBESHA512/224: []
    HmacPBESHA512/256: []
    PBEWithHmacSHA1: []
    PBEWithHmacSHA224: []
    PBEWithHmacSHA256: []
    PBEWithHmacSHA384: []
    PBEWithHmacSHA512: []
    PBEWithHmacSHA512/224: []
    PBEWithHmacSHA512/256: []
    PBEWITHHMACSHA: []
  Signature:
    NONEwithRSA: []
    MD2withRSA: []
    MD5withRSA: [MD5/RSA, MD5withRSAEncryption]
    MD5andSHA1withRSA: []
    SHA1withRSA: [SHA1/RSA, SHA-1/RSA, SHA1withRSAEncryption]
    SHA224withRSA: [SHA224/RSA, SHA224withRSAEncryption]
    SHA256withRSA: [SHA256/RSA, SHA256withRSAEncryption]
    SHA384withRSA: [SHA384/RSA, SHA384withRSAEncryption]
    SHA512withRSA: [SHA512/RSA, SHA512withRSAEncryption]
    SHA512/224withRSA: []
    SHA512/256withRSA: []
    SHA3-224withRSA: []
    SHA3-256withRSA: []
    SHA3-384withRSA: []
    SHA3-512withRSA: []
    SHA1withRSA/PSS: [SHA1withRSAandMGF1]
    SHA256withRSA/PSS: [SHA256withRSAandMGF1]
    SHA224withRSA/PSS: []
    SHA384withRSA/PSS: []
    SHA512withRSA/PSS: []
    RSASSA-PSS: []
    NONEwithECDSA: []
    NONEwithECDSAinP1363Format: []
    SHA1withECDSA: [ECDSA, ECDSAwithSHA1]
    SHA224withECDSA: [SHA224/ECDSA]
    SHA256withECDSA: [SHA256/ECDSA]
    SHA384withECDSA: [SHA384/ECDSA]
    SHA512withECDSA: [SHA512/ECDSA]
    SHA3-224withECDSA: []
    SHA3-256withECDSA: []
    SHA3-384withECDSA: []
    SHA3-512withECDSA: []
    SHA1withECDSAinP1363Format: []
    SHA224withECDSAinP1363Format: []
    SHA256withECDSAinP1363Format: []
    SHA384withECDSAinP1363Format: []
    SHA512withECDSAinP1363Format: []
    SHA3-224withECDSAinP1363Format: []
    SHA3-256withECDSAinP1363Format: []
    SHA3-384withECDSAinP1363Format: []
    SHA3-512withECDSAinP1363Format: []
    NONEwithDSA: [RAWDSA]
    NONEwithDSAinP1363Format: []
    SHA1withDSA: [DSA, SHA/DSA, DSAwithSHA1]
    SHA256withDSA: [SHA256/DSA]
    SHA224withDSA: []
    SHA384withDSA: []
    SHA512withDSA: []
    SHA3-224withDSA: []
    SHA3-256withDSA: []
    SHA3-384withDSA: []
    SHA3-512withDSA: []
    SHA1withDSAinP1363Format: []
    SHA224withDSAinP1363Format: []
    SHA256withDSAinP1363Format: []
    SHA384withDSAinP1363Format: []
    SHA512withDSAinP1363Format: []
    SHA3-224withDSAinP1363Format: []
    SHA3-256withDSAinP1363Format: []
    SHA3-384withDSAinP1363Format: []
    SHA3-512withDSAinP1363Format: []
    Ed25519: []
