    AndroidKeyStore: []
    BKS: []
    BCFKS: []
    JKS: []
    PKCS12: []
# A key-size suffix is a separate fact: AES_256 is AES with a 256-bit key constraint (Conscrypt, SunJCE).
sized:
  Cipher:
    AES_128: {name: AES, keySize: 128}
    AES_192: {name: AES, keySize: 192}
    AES_256: {name: AES, keySize: 256}
# Transformation engines: a name not listed above is algorithm/mode/padding, each part canonicalised.
transformations:
  Cipher:
    modes: [NONE, ECB, CBC, CFB, CFB8, CFB128, OFB, OFB8, OFB128, CTR, CTS, GCM, GCM-SIV, CCM, KW, KWP, PCBC]
    paddings: [NoPadding, PKCS1Padding, PKCS5Padding, ISO10126Padding, SSL3Padding, OAEPPadding,
               OAEPWithSHA-1AndMGF1Padding, OAEPWithSHA-224AndMGF1Padding, OAEPWithSHA-256AndMGF1Padding,
               OAEPWithSHA-384AndMGF1Padding, OAEPWithSHA-512AndMGF1Padding,
               OAEPWithSHA-512/224AndMGF1Padding, OAEPWithSHA-512/256AndMGF1Padding]
    # OAEPWithSHA1AndMGF1Padding stays uncatalogued: a JDK 25 provider registers it beside the hyphen spelling,
    # so an alias makes config's duplicate_name refuse that provider's inventory.
    # PKCS#7 padding equals PKCS#5 padding for these block ciphers (RFC 5652 6.3); Conscrypt aliases them.
    paddingSynonyms:
      AES: {PKCS7Padding: PKCS5Padding}
      DESede: {PKCS7Padding: PKCS5Padding}
    # RSA is one block: Conscrypt and BouncyCastle register RSA/None/* as aliases of RSA/ECB/*.
    modeSynonyms:
      RSA: {NONE: ECB}
keyFormats: [RAW, PKCS#8, X.509]
