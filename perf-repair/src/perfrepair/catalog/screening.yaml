# Per (engine type, canonical name): what the sources say; unlisted is unknown. Limits of the key: docs/screening.md.
schemaVersion: 1
sources:
  R2: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf
  R3: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar3.ipd.pdf
  RFC6151: https://www.rfc-editor.org/rfc/rfc6151
  RFC6194: https://www.rfc-editor.org/rfc/rfc6194
  RFC7465: https://www.rfc-editor.org/rfc/rfc7465
  RFC6149: https://www.rfc-editor.org/rfc/rfc6149
  RFC8017: https://www.rfc-editor.org/rfc/rfc8017
  FIPS46: https://csrc.nist.gov/pubs/fips/46-3/final
  SP80067: https://csrc.nist.gov/pubs/sp/800/67/r2/final
  SWEET32: https://sweet32.info/
  ARISK: https://developer.android.com/privacy-and-security/risks/broken-cryptographic-algorithm
  ACRYPTO: https://developer.android.com/privacy-and-security/cryptography
  APRNG: https://developer.android.com/privacy-and-security/risks/weak-prng
  LINT: https://github.com/google/android-security-lints/blob/main/checks/src/main/java/com/example/lint/checks/BadCryptographyUsageDetector.kt
  LINTGI: https://googlesamples.github.io/android-custom-lint-rules/checks/GetInstance.md.html
  ORACLE: https://docs.oracle.com/en/java/javase/17/security/oracle-providers.html
  AOSP9: https://android.googlesource.com/platform/libcore/+/refs/tags/android-9.0.0_r1/ojluni/src/main/java/sun/security/jca/Providers.java
  AOSP12: https://android.googlesource.com/platform/libcore/+/refs/heads/android12-release/ojluni/src/main/java/sun/security/jca/Providers.java
# A listed base or mode deprecates the transformation; a mode that modeSynonyms maps onto is nominal for that base.
components:
  Cipher:
    base:
      DES: {status: deprecated, reason: FIPS 46-3 withdrawn 2005; Android names DES weak, source: FIPS46}
      DESede: {status: deprecated, reason: 'r2 Table 1: 3-key TDEA encryption disallowed after 2023; SP 800-67r2 withdrawn 2024-01-01', source: R2}
      RC2: {status: deprecated, reason: Android security lint VULNERABLE_BLOCK_CIPHER_ALGORITHMS, source: LINT}
      ARCFOUR: {status: deprecated, reason: keystream biases; RFC 7465 MUST NOT in TLS; Android names RC4 weak, source: RFC7465}
      Blowfish: {status: deprecated, reason: 64-bit block, birthday-bound at ~32 GB independent of key length, source: SWEET32}
    mode:
      ECB: {status: deprecated, reason: ECB leaks plaintext structure; r3 draft disallows ECB for confidentiality; Android lint GetInstance flags ECB, source: LINTGI}
# AOSP DEPRECATED_ALGORITHMS throws at targetSdk >= deprecatedApi. Left out: OIDs, non-item types, Mac PBEWITHHMACSHA*
# (Conscrypt aliases it to HmacSHA*), KeyPairGenerator RSA (off the AOSP12 list, still registered at API 36).
platform:
  - provider: BC
    deprecatedApi: 28
    removedApi: 31
    reason: platform BC implementation deprecated in Android 9 and removed in Android 12; use the default provider
    source: AOSP9
    names:
      Cipher: [AES/GCM/NoPadding, ARCFOUR, ARCFOUR/ECB/NoPadding, ARCFOUR/NONE/NoPadding]
      KeyAgreement: [ECDH]
      KeyFactory: [EC]
      KeyGenerator: [AES, DESede, HmacMD5, HmacSHA1, HmacSHA224, HmacSHA256, HmacSHA384, HmacSHA512]
      KeyPairGenerator: [EC]
      Mac: [HmacMD5, HmacSHA1, HmacSHA224, HmacSHA256, HmacSHA384, HmacSHA512]
      MessageDigest: [MD5, SHA-1, SHA-224, SHA-256, SHA-384, SHA-512]
      SecretKeyFactory: [DESede]
      Signature: [MD5withRSA, NONEwithECDSA, SHA1withECDSA, SHA1withRSA, SHA224withECDSA, SHA224withRSA, SHA256withECDSA,
                  SHA256withRSA, SHA384withECDSA, SHA384withRSA, SHA512withECDSA, SHA512withRSA]
  - provider: BC
    deprecatedApi: 28
    removedApi: null
    reason: platform BC implementation deprecated in Android 9 and still listed; use the default provider
    source: AOSP12
    names:
      KeyFactory: [RSA]
