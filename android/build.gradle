// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    // Version catalogs need Gradle 7; this project is on 6.5. Revisit at #11.
    ext.versions = [
            kotlin: '1.6.21',   // last Kotlin line supporting Gradle 6.5
    ]
    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${versions.kotlin}"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'io.github.raphael28:hunter-debug-plugin:1.0.1'
        classpath 'io.github.raphael28:hunter-transform:0.9.8'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}