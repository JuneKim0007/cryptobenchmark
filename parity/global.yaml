# Inbound, written by hand. What a run measures, and what it does when something fails.
schemaVersion: 1                         # required

selection:                               # required
  testSet: config_testset_example.yaml   # required — relative to this file
  exclude: []                            # optional, default [] — e.g. {provider: SunJCE} to drop one provider

run:                                     # optional — every key falls back to its default
  inputSizes: [1024]                     # optional, default [1024] — bytes per call
  phases: [WARM]                         # optional, default [WARM] — WARM
  metrics: [TIME]                        # optional, default [TIME] — TIME | ALLOCATION
  processRepetitions: 1                  # optional, default 1
  seed: 42                               # optional, default 0
  thermalGate:                           # optional, absent = off; --device only
    temperatureKeptCelsius: 36.0         # required: phone skin temperature no run may reach; a run ending at or above it is discarded
    cooldownMinutes: 3                   # optional, default 3: wait this long, without reading the phone, when it is too hot
    pollMinutes: 1                       # optional, default 1: then read it this often
    pollTerminateMinutes: 30             # optional, default 30: still too hot after this long: stop the benchmark
    discardLimit: 5                      # optional, default 5: runs of one case discarded for heat before giving up on it
    onDiscardLimit: nextCase             # optional, default nextCase: nextCase | stop
    readRetries: 2                       # optional, default 2: extra attempts when a temperature reading fails
    readRetrySeconds: 1                  # optional, default 1: seconds between those attempts
    startMargin:                         # optional: how many Celsius BELOW temperatureKeptCelsius a run must START
      dynamic: true                      # optional, default true: adjust during the session; false stays at initialCelsius
      initialCelsius: 0.25               # optional, default 0.25: start with this margin, so 36.0 - 0.25 = start at or below 35.75
      backoffFactor: 2                   # optional, default 2: after a discarded run, multiply the margin by this
      maximumCelsius: 3.0                # optional, default 3.0: the margin never grows past this
      cleanRunsToRecover: 10             # optional, default 10: this many clean runs in a row narrow the margin...
      recoveryCelsius: 0.05              # optional, default 0.05: ...by this much, never below initialCelsius
  launchRetries: 2                       # optional, default 2: a run that failed for a reason other than heat is launched this many more times
  # harness: {iterations: 50, warmupIterations: null, profiling: none}   # optional — omitted here, the harness's defaults apply

policy:                                  # optional
  onFailure: skip                        # optional, default skip — stop | skip

# analysis:                              # optional — how results are summarised and drawn
#   charts: [iqrBars, throughput, latency, stability]   # optional, default all four
#   dir: results/chart/<run-id>          # optional, default <device folder>/chart/<run-id>
#   statistic:
#     headline: auto                     # optional, default auto — auto | median | mean
#     meanUpToCovPercent: 5              # optional, default 5 — auto: mean while CoV <= this, else median
#   units:                               # optional — display only; results stay ns/op
#     latency: ms                        # optional, default ms — ms | us | ns
#     throughput: MB/s                   # optional, default MB/s — MB/s | MiB/s | ops/s

providers:                               # optional — providers the app ships, appended after the platform's
  bundled:                               # optional, default [] — each built into the APK and installed before the probe
  - artifact: org.example:crypto-provider:1.0     # required — group:name:version, an implementation dependency
    create: org.example.crypto.ExampleProvider#newProvider   # required — Class (no-argument constructor) or Class#staticFactory
    alias: ExampleBundled                # optional — required when the provider's name is already installed
