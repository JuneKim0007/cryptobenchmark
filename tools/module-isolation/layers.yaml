# Dependency rules read by architecture/ (ArchUnit) and handoff_check.py. Names are relative to root, then to the module's package.
root: io.github.junekim0007.cryptobench

modules:
  files:
    uses: {}
  jca:
    uses: {}
  document:
    uses: {}
  contract:
    uses:
      files: [StampedName]
      document: [SchemaVersion, DocumentFields, versioned.DocumentReader, versioned.VersionedFile, versioned.YamlFiles]
  discovery:
    uses:
      jca: [bind.BindException, bind.BindPolicy, bind.BoundParameters, bind.ParameterBinder, failure.Attempt, failure.ErrorText, peer.PeerPair, reflect.Reflect]
      contract: all
      files: all
      document: all
  records:
    uses:
      document: [ErrorCode]
  catalogue:
    uses:
      files: [FileNames, VariantLabels]
  settings:
    uses: {}
  config:
    uses:
      contract: [bundled.BundledProvider]
      settings: [EnergySettings, Facts, HarnessSettings, Leaf, Metric, Nested, OnFailure, Phase, RunKeys, Section, Unsupported, Values]
      records: [Skip, StoppedOnFailureException]
      catalogue: [EngineRows]
      files: all
      document: all
  preparation:
    uses:
      jca: [bind.BindException, bind.BindPolicy, bind.BoundParameters, bind.ParameterBinder, failure.Attempt, failure.ErrorText, peer.PeerPair, reflect.Reflect]
      settings: [HarnessSettings, Metric, OnFailure, Phase, RunKeys]
      records: [Skip, StoppedOnFailureException]
      catalogue: [EngineRows]
      files: all
      document: all
  benchmark:
    uses:
      jca: [bind.BindException, bind.BindPolicy, bind.BoundParameters, bind.ParameterBinder, failure.Attempt]
      preparation: [measurement.BenchmarkCase, measurement.Operation, prepare.PreparedCase, operation.Invocations, operation.Invocation, Preparation,
        prepare.Listing, prepare.PreparationException, record.PreparedFile, report.SkipFile,
        global.GlobalSettings, shared.FailureText, peer.Outcome, peer.OutputBytes, peer.PeerEngine, peer.ProducedCall, peer.Consumer, peer.Travel]
      settings: [HarnessSettings, EnergySettings, CpuSettings, Metric, OnFailure]
      records: [Skip, StoppedOnFailureException]
      files: all
      document: [AtomicFile, DocumentFields, YamlCodec, versioned.DocumentReader, versioned.MapDocument, versioned.VersionedFile, versioned.YamlFile, versioned.YamlFiles]

# The one file that may name each androidx entry point: a second config or loop would bypass the collection between samples.
owned:
  sources: apps/benchmark/modules/android/src/androidTest/kotlin
  entries:
    MicrobenchmarkConfig: JetpackConfig.kt
    BenchmarkRule: JetpackCase.kt
    measureRepeated: JetpackCase.kt
    BenchmarkState: JetpackCase.kt

consumers:
  androidTest:
    sources: apps/benchmark/modules/android/src/androidTest/kotlin
    uses:
      preparation: [Preparation, adapter.DiscoveryCapability, interop.InteropRun, interop.plan.InteropPlanFile, interop.report.InteropFile,
        operation.Invocations, prepare.PreparedCase, measurement.BenchmarkCase,
        measurement.Operation, key.plan.KeyPlanner, key.plan.KeyRecipe, key.generate.KeyMaterial, key.generate.KeyMaterialGenerator]
      benchmark: [report.MetricSamples, check.PlanCheck, check.RunnablePlan, check.Refusal, check.EnergyCapability,
        run.CaseSettings, run.compose.CaseRuns, run.energy.Energy, run.energy.WindowMarker]
      settings: [CpuSettings, Metric]
      records: [Skip]
      jca: [failure.Attempt]
      files: all
      discovery: [Discovery, bundled.BundledInstaller, bundled.BundledProviders, bundled.ProviderFactory, write.ProbeDirectory]
      document: [YamlCodec, YamlLine]
  cli:
    sources: apps/benchmark/cli/src/main/kotlin
    uses:
      jca: all
      files: all
      document: all
      contract: all
      discovery: all
      settings: all
      records: all
      catalogue: all
      config: all
      preparation: all
      benchmark: all

# every package is a node; top-level groups a module's packages by their first segment
cycles: [package, top-level]

# package names cover their subpackages; a capitalised last segment names a class. A rule whose package is absent applies once it appears.
forbidden:
  - {module: preparation, from: build, to: prepare}
  - {module: preparation, from: plan, to: role}
  - {module: preparation, from: device, to: role}
  - {module: benchmark, from: run, to: report}
  - {module: benchmark, from: run, to: verify}
  - {module: benchmark, from: verify, to: run.HostHarness}
  - {module: benchmark, from: verify, to: report}
