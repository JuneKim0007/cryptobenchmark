# Dependency rules read by architecture/ (ArchUnit) and handoff_check.py. Names are relative to root, then to the module's package.
root: io.github.junekim0007.cryptobench

modules:
  discovery:
    uses: {}
  settings:
    uses: {}
  config:
    uses:
      settings: [Facts, HarnessSettings, Metric, Unsupported]
  preparation:
    uses:
      settings: [HarnessSettings, Metric]
  benchmark:
    uses:
      preparation: [measurement.BenchmarkCase, measurement.Operation, prepare.PreparedCase, operation.Invocations, operation.Invocation, Preparation,
        prepare.Listing, prepare.PreparationException, prepare.StoppedOnFailureException, record.PreparedFile, report.Skip, report.SkipFile,
        global.GlobalSettings, global.OnFailure, shared.FailureText]
      settings: [HarnessSettings, EnergySettings, CpuSettings, Metric]

consumers:
  androidTest:
    sources: apps/benchmark/modules/android/src/androidTest/kotlin
    uses:
      preparation: [Preparation, adapter.DiscoveryCapability, interop.InteropRun, interop.plan.InteropPlanFile, interop.report.InteropFile,
        operation.Invocations, prepare.PreparedCase, report.Skip, measurement.BenchmarkCase,
        measurement.Operation, key.plan.KeyPlanner, key.plan.KeyRecipe, key.generate.KeyMaterial, key.generate.KeyMaterialGenerator]
      benchmark: [check.PlanCheck, check.RunnablePlan, check.Refusal, check.EnergyCapability, run.CaseSettings, run.compose.CaseRuns, run.energy.Energy,
        run.energy.WindowMarker]
      settings: [CpuSettings, Metric]
      discovery: [Discovery, bundled.BundledInstaller, bundled.BundledProviders, bundled.ProviderFactory, write.ProbeDirectory, write.YamlCodec]
  cli:
    sources: apps/benchmark/cli/src/main/kotlin
    uses:
      discovery: all
      settings: all
      config: all
      preparation: all
      benchmark: all

# every package is a node; top-level groups a module's packages by their first segment
cycles: [package, top-level]

# package names cover their subpackages; a capitalised last segment names a class. A rule whose package is absent applies once it appears.
forbidden:
  - {module: preparation, from: build, to: prepare}
  - {module: preparation, from: plan, to: role}
  - {module: preparation, from: device, to: role}
  - {module: benchmark, from: run, to: report}
  - {module: benchmark, from: run, to: verify}
  - {module: benchmark, from: verify, to: run.HostHarness}
  - {module: benchmark, from: verify, to: report}
