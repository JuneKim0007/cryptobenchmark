# written by :config DefaultsDocument (-Dexamples.update); read by lib/cryptobench/cryptobench/shared/settings/defaults.py
schemaVersion: 1
run:
  inputSizes: [1024]
  phases: [WARM]
  metrics: [TIME]
  variants: [fixed, notFixed, secure]
  processRepetitions: 1
  seed: 0
  caseCooldownSeconds: 0
  launchRetries: 2
  resumeBlockRuns: 10
  warmup:
    iterations: 10
    jobs: []
    cases: 3
  thermalGate:
    cooldownMinutes: 3
    pollMinutes: 1
    pollTerminateMinutes: 30
    discardLimit: 5
    onDiscardLimit: nextCase
    readRetries: 2
    readRetrySeconds: 1
    startMargin: {dynamic: true, initialCelsius: 0.25, backoffFactor: 2.0, maximumCelsius: 3.0,
      cleanRunsToRecover: 10, recoveryCelsius: 0.05}
  harness:
    energy: {capture: none, source: rails}
analysis:
  statistic: {headline: auto, meanUpToCovPercent: 5.0}
  charts: [iqrBars, throughput, latency, stability]
  units: {latency: ms, throughput: MB/s}
