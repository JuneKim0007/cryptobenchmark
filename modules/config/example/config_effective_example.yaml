schemaVersion: 1
generatedFrom:
  global: config_global_example.yaml
  testSet: config_testset_example.yaml
  inventory: inventory.yaml
  capture: config_capture_example.yaml
  trial: config_trial_example.yaml
  device: {model: '', manufacturer: '', hardware: '', sdkInt: 0, release: '', javaVersion: 17.0.11,
    defaultKeySizeProperty: '', fingerprint: '', javaVendor: Eclipse Adoptium, javaRuntimeVersion: 17.0.11+9,
    osName: Linux, osArch: x86_64}
run:
  inputSizes: [1024]
  phases: [WARM]
  metrics: [TIME]
  processRepetitions: 1
  isolation: case
  seed: 42
  scopedRepetitions: 3
  caseCooldownSeconds: 0
  warmup:
    iterations: 10
    jobs: []
policy: {onFailure: skip}
analysis:
  statistic: {headline: auto, meanUpToCovPercent: 5.0}
  charts: [iqrBars, throughput, latency, stability]
  units: {latency: ms, throughput: MB/s}
bundledProviders:
- {artifact: 'org.example:crypto-provider:1.0', create: org.example.crypto.ExampleProvider#newProvider,
  alias: ExampleBundled}
providers:
  SUN:
    MessageDigest:
      SHA-256: {}
  SunJCE:
    Cipher:
      AES/GCM/NoPadding:
        keySizes: [128, 256]
        parameters:
          class: javax.crypto.spec.GCMParameterSpec
          arguments: [128, fresh(12)]
    Mac:
      HmacSHA256: {}
