apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.3'
    api project(':settings')
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    def update = System.getProperty('examples.update')
    if (update != null) {
        systemProperty 'examples.update', update
    }
    // A device's own trial, for KeyAlgorithmContractTest: the example trial carries this module's
    // names, a real capture carries the device's.
    def trial = System.getProperty('trial')
    if (trial != null) {
        systemProperty 'trial', trial
    }
}
