apply plugin: 'com.android.application'

android {
    namespace 'io.github.junekim0007.cryptobench'
    compileSdk 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.benchmark.junit4.AndroidBenchmarkRunner"
    }

    testBuildType "release"

    buildTypes {
        release {
            // A benchmark APK must not be debuggable; the debug key signs it so no key is kept in the repository.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':environment:discovery')
    implementation project(':preparation')
    androidTestImplementation 'androidx.benchmark:benchmark-junit4:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
}
