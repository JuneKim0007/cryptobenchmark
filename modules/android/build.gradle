apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'io.github.junekim0007.cryptobench'
    compileSdk 36

    sourceSets {
        androidTest.kotlin.srcDirs += 'src/androidTest/kotlin'
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.benchmark.junit4.AndroidBenchmarkRunner"
    }

    testBuildType "release"

    buildTypes {
        release {
            // A benchmark APK must not be debuggable; the debug key signs it so no key is kept in the repository.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ndkVersion "29.0.14206865"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // The app APK is a pure instrumentation target: it holds no measured code, but
    // AndroidBenchmarkRunner launches androidx.benchmark's IsolationActivity inside it,
    // so the library's manifest has to merge into the app, not only into the test APK.
    implementation 'androidx.benchmark:benchmark-junit4:1.5.0'
    androidTestImplementation project(':benchmark')
    // DeviceProbe writes this device's own capture and trial; without it the only plan a
    // device can be given is a host JVM's, which preparation correctly refuses.
    androidTestImplementation project(':environment:discovery')
    androidTestImplementation 'androidx.benchmark:benchmark-junit4:1.5.0'
    // 1.5.2, not a newer pin: benchmark-junit4 resolves androidx.test:runner strictly at
    // 1.5.2, and AGP keeps the app and androidTest classpaths consistent.
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
