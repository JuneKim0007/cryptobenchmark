apply plugin: 'com.android.application'
apply plugin: 'hunter-debug'

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 27 // DO NOT CHANGE: https://android-developers.googleblog.com/2018/03/cryptography-changes-in-android-p.html
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        //testInstrumentationRunner 'androidx.test.ext.junit.runners.AndroidJUnit4'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "KEY_LEN", "\"$KEY_LEN\""
        buildConfigField "String", "INPUT_SIZE", "\"$INPUT_SIZE\""
        buildConfigField "String", "N_TIMES", "\"$N_TIMES\""
        buildConfigField "String", "PROVIDER", "\"$PROVIDER\""
        buildConfigField "String", "ALGORITHM", "\"$ALGORITHM\""
        buildConfigField "String", "PADDING", "\"$PADDING\""
        buildConfigField "String", "MODE", "\"$MODE\""
        buildConfigField "String", "COOL_DOWN_TIME", "\"$COOL_DOWN_TIME\""
        buildConfigField "String", "WARM_UP_TIME", "\"$WARM_UP_TIME\""
        buildConfigField "String", "WITH_KEY_SPEC", "\"$WITH_KEY_SPEC\""

    }
    //testBuildType System.getProperty('testBuildType', 'debug')
    testBuildType "release" // WARNING: this seems to break instrumentation test execution via Android Studio
    signingConfigs {

        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
            // Optional, specify signing versions used
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    //implementation 'io.github.raphael28:hunter-debug-library:1.0.1'
    implementation 'io.github.greensoftwarelab:hunter-emanafa-library:1.0.1'
    //testImplementation 'junit:junit:4.12'
    testImplementation("org.json:json:20210307")
    //testImplementation 'org.robolectric:robolectric:4.6.1'
    //androidTestImplementation 'io.github.raphael28:hunter-debug-library:1.0.1'
    androidTestImplementation 'io.github.greensoftwarelab:hunter-emanafa-library:1.0.1'
    //androidTestImplementation 'com.android.support.test:runner:1.0.2'
    //androidTestImplementation 'junit:junit:4.12'
    //androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation("androidx.test:runner:1.2.0")

}
