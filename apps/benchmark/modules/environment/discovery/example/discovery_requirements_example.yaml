# A sample requirements_<utc>.yaml: what the third trial level measured per registered service.
# Pairs with the capture by capturedAtMillis. Device-scoped: these facts never go into a catalogue.
schemaVersion: 1
capturedAtMillis: 1750000000000
deviceClockMillis: 1750000000000
millis: 120
keyCache:
  generated: 2
  refused: 1
  reused: 4
  generationMillis: 3
services:
- provider: SunJCE
  type: Cipher
  algorithm: AES/GCM/NoPadding
  transformationOf: AES
  className: com.sun.crypto.provider.AESCipher$General
  status: runnable
  key:
    source: KeyGenerator
    algorithm: AES
    class: javax.crypto.spec.SecretKeySpec
    provider: SunJCE
    bits: 256
  runWith:
    operation: encrypt
    providerGenerates: true
    spec:
      class: GCMParameterSpec
      ivBytes: 12
      tagBits: 128
    inputBytes: 64
  facts:
    tagBits:
      accepted: 96,104,112,120,128
      firstRefusal: '0: InvalidAlgorithmParameterException: Unsupported TLen value.'
    roundTrip: true
    tamper: refused AEADBadTagException
  millis: 4
- provider: Vault
  type: Cipher
  algorithm: AES/GCM/NoPadding
  className: example.VaultCipher
  classRun: example.VaultCipher
  status: not_runnable
  reason: keystore_born_key
  detail: 'InvalidKeyException: Unsupported key'
  conditions:
  - keystore-born key
  keysTried:
  - source: KeyGenerator
    algorithm: AES
    class: javax.crypto.spec.SecretKeySpec
    provider: SunJCE
    bits: 256
    refused: 'InvalidKeyException: Unsupported key'
  millis: 1
- provider: SUN
  type: SecureRandom
  algorithm: DRBG
  className: sun.security.provider.DRBG
  classRun: sun.security.provider.DRBG
  status: no_call
  reason: no_call_for_type
  millis: 0
