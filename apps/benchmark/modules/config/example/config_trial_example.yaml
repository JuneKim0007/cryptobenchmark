# Outbound. What discovery writes after calling every captured service once with a default key:
# what really runs on this device, and what the JCA refused. Pairs with the capture by capturedAtMillis.
schemaVersion: 3
capturedAtMillis: 1750000000000
defaultRunInputSize: 1024
# One key per catalogue key size or curve and hardware path of a keystore provider's generators; absent: {reason} on a runtime without one.
keystore:
  rows:
  - {provider: AndroidKeyStore, type: KeyPairGenerator, algorithm: RSA, backing: strongbox, keySize: 2048, supported: true, millis: 8012}
  - {provider: AndroidKeyStore, type: KeyPairGenerator, algorithm: RSA, backing: strongbox, keySize: 3072, supported: false, error: 'keystore_unsupported: KeyPairGenerator RSA/3072 strongbox: KeyStoreException: Unsupported key size', millis: 41}
services:
- provider: SUN
  type: MessageDigest
  algorithm: SHA-256
  instantiates: true
  defaultRun:
    works: true
    inputSize: 1024
- provider: SUN
  type: MessageDigest
  algorithm: SHA-512
  instantiates: true
  defaultRun:
    works: true
    inputSize: 1024
- provider: SunRsaSign
  type: KeyPairGenerator
  algorithm: RSA
  instantiates: true
  defaultRun:
    works: true
    keyAlgorithm: RSA
    keyProvider: SunRsaSign
    keySize: 2048
- provider: SunJCE
  type: Cipher
  algorithm: AES
  instantiates: true
  transformations:
  - name: AES/GCM/NoPadding
    instantiates: true
    defaultRun:
      works: true
      keyAlgorithm: AES
      keyProvider: SunJCE
      keySize: 256
      inputSize: 1024
  - name: AES/CBC/PKCS5Padding
    instantiates: true
    defaultRun:
      works: true
      keyAlgorithm: AES
      keyProvider: SunJCE
      keySize: 256
      inputSize: 1024
  - name: AES/CTR/PKCS5Padding
    instantiates: false
    error: 'NoSuchPaddingException: PKCS5Padding cannot be used with CTR'
- provider: SunJCE
  type: Mac
  algorithm: HmacSHA256
  instantiates: true
  defaultRun:
    works: true
    keyAlgorithm: HmacSHA256
    keyProvider: SunJCE
    inputSize: 1024
- provider: SunJCE
  type: KeyGenerator
  algorithm: AES
  instantiates: true
  defaultRun:
    works: true
    keyAlgorithm: AES
    keyProvider: SunJCE
    keySize: 256
- provider: SunJCE
  type: KeyGenerator
  algorithm: HmacSHA256
  instantiates: true
  defaultRun:
    works: true
    keyAlgorithm: HmacSHA256
    keyProvider: SunJCE
