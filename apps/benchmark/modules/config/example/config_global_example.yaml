# Inbound, written by hand. What a run measures, and what it does when something fails.
schemaVersion: 1                         # required

selection:                               # required
  testSet: config_testset_example.yaml   # required — relative to this file
  exclude: []                            # optional, default [] — e.g. {provider: SunJCE} to drop one provider

run:                                     # optional — every key falls back to its default
  inputSizes: [1024]                     # optional, default [1024] — bytes per call
  phases: [WARM]                         # optional, default [WARM] — WARM
  metrics: [TIME]                        # optional, default [TIME] — TIME | ALLOCATION | CPU_EVENTS
  processRepetitions: 1                  # optional, default 1
  seed: 42                               # optional, default 0
  thermalGate: {sensors: [BIG, MID, LITTLE], timeoutSeconds: 120}   # optional, default absent = off — --device only
  # harness: {iterations: 50, warmupIterations: null, profiling: none}   # optional — omitted here, the harness's defaults apply

policy:                                  # optional
  onFailure: skip                        # optional, default skip — stop | skip

# analysis:                              # optional — how results are summarised and drawn
#   charts: [iqrBars, throughput, latency, stability]   # optional, default all four
#   dir: results/chart/<run-id>          # optional, default <device folder>/chart/<run-id>
#   statistic:
#     headline: auto                     # optional, default auto — auto | median | mean
#     meanUpToCovPercent: 5              # optional, default 5 — auto: mean while CoV <= this, else median
#   units:                               # optional — display only; results stay ns/op
#     latency: ms                        # optional, default ms — ms | us | ns
#     throughput: MB/s                   # optional, default MB/s — MB/s | MiB/s | ops/s

providers:                               # optional — providers the app ships, appended after the platform's
  bundled:                               # optional, default [] — each built into the APK and installed before the probe
  - artifact: org.example:crypto-provider:1.0     # required — group:name:version, an implementation dependency
    create: org.example.crypto.ExampleProvider#newProvider   # required — Class (no-argument constructor) or Class#staticFactory
    alias: ExampleBundled                # optional — required when the provider's name is already installed
