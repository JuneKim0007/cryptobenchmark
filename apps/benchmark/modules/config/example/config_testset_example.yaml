# Inbound, written by hand. The primitives a run measures, with the key sizes and parameters each needs.
schemaVersion: 1                         # required
description: five primitives from the example capture   # optional, free text

include:                                 # optional — empty selects every primitive the inventory can run
  # a rule needs at least one of provider | type | name; each part is optional; name accepts *
  - {provider: SUN, type: MessageDigest, name: SHA-256}   # provider: only this provider's primitive
  - {type: Mac, name: HmacSHA256, group: short, variants: [fixed]}   # group: an entry HmacSHA256@short; variants: this include's paths
  - {type: Cipher, name: AES/GCM/NoPadding}              # type and name: every provider's AES/GCM/NoPadding
  - {provider: SunJCE, type: KeyGenerator, name: AES, variants: [secure]}   # secure: the hardware-isolated key path only
  - {type: KeyPairGenerator, name: RSA}                  # generation is the measured call

exclude: []                              # optional, default [] — same rule shape; exclude always wins

overrides:                               # optional
  - match: {type: Cipher, name: "AES/*"} # required — a rule; precedence in docs/config.md
    set: {keySizes: [128, 256]}          # required — every key inside is optional:
                                         #   keySizes, inputSizes, key, parameters, operations, variants, harness
  - match: {type: Cipher, name: AES/GCM/NoPadding}   # the later and more specific override wins
    set: {parameters: {class: javax.crypto.spec.GCMParameterSpec, arguments: [128, fresh(12)]}, operations: [ENCRYPT, DECRYPT]}   # parameters: a tree passed to preparation; operations: these only
  - match: {provider: SunJCE, type: Mac, name: HmacSHA256, group: short}   # group: that group's entry only
    set:                                 # every key below is optional
      inputSizes: [64]                   # replaces run.inputSizes for these entries
      key: {algorithm: HmacSHA256, provider: same}   # the key's generator and its provider
      variants: [fixed, notFixed]        # beats the include's variants
      harness: {iterations: 20, profiling: none}   # merged key by key over run.harness
  - match: {type: KeyGenerator, name: AES}       # the secure entry above
    set: {key: {backing: strongbox}}     # backing: tee (default) | strongbox, where a secure key is born
  - match: {type: KeyPairGenerator, name: RSA}   # a key spec tree: class + arguments, or field
    set: {key: {class: java.security.spec.RSAKeyGenParameterSpec, arguments: [2048, {field: java.security.spec.RSAKeyGenParameterSpec.F4}]}}   # the generator's init spec
