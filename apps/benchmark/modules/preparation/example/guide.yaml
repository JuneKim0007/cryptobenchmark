# What the implementation guide says for each item of the effective file beside it; written by lib/cryptobench/cryptobench/stages/configuration/guide.py.
schemaVersion: 1
items:
  SUN:
    MessageDigest:
      SHA-256:
        build: SUN @ jdk-25
        exactBuild: false
  SunJCE:
    Cipher:
      AES/GCM/NoPadding:
        build: SunJCE @ jdk-25
        exactBuild: false
        parameters:
          class: javax.crypto.spec.GCMParameterSpec
          arguments:
          - 128
          - fresh(12)
        keySizes:
        - 128
        - 192
        - 256
    Mac:
      HmacSHA256:
        build: SunJCE @ jdk-25
        exactBuild: false
