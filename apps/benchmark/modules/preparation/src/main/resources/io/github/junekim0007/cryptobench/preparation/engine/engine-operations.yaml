# Per JCA engine type, the operations the harness times; a type not listed falls back to TYPE_DEFAULT, which times nothing.
# Read by engine/EngineTypes and copied into each run's manifest.yaml operations, so a results reader shares one list.
schemaVersion: 1
fallback: [TYPE_DEFAULT]
types:
  Cipher: [ENCRYPT, DECRYPT]
  Signature: [SIGN, VERIFY]
  Mac: [COMPUTE_MAC]
  MessageDigest: [DIGEST]
  KeyGenerator: [GENERATE_KEY]
  KeyPairGenerator: [GENERATE_KEY_PAIR]
  KeyAgreement: [AGREE_KEY]
