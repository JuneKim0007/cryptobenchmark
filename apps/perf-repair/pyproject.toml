[project]
name = "perfrepair"
version = "0.1.0"
description = "LLM-guided crypto performance repair over cryptobenchmark results"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
api = ["anthropic>=0.84"]
# pinned: grammar node types are read by name in scope/syntax/grammar.py
scope = ["tree-sitter==0.26.0", "tree-sitter-java==0.23.5", "tree-sitter-kotlin==1.1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
perfrepair = ["prompts/**/*.md", "**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "tests/grouping"]
testpaths = ["tests"]
