# Copy to perfrepair.yaml (git-ignored); llm.config in settings.yaml names it for apps/cli/facade.py.
# Directly, name a copy with --perfrepair-config or PERFREPAIR_CONFIG. The results root, the benchmark's global.yaml and
# the run's id are in settings.yaml, or the guide's flags: a value for one of them here is a placement error.
# Every key is optional; a missing or null key falls through to the next layer:
#   CLI flag > a role section here (device.grouping.assign, device.screening.classify,
#   device.worthiness, apps.agent, apps.replace, apps.upgrade) > environment (PERFREPAIR_*) > the gateway's block here > .env
#   > the role's code default > the general code default.
# aiGateway stays empty below: a value there would outrank .env and raise every role, so a plain copy changes nothing.
# Relative paths resolve against this file's folder. Secrets (API keys, tokens) are refused here:
# keep ANTHROPIC_API_KEY in the environment or .env.
# A bad value here warns and uses the default, except device.id, device.screening.catalog and aiGateway.use/auth,
# which stop the command; a key nothing reads warns. docs/settings.md lists every key.

aiGateway:                 # shared: every model-calling command
  use:                     # claude | dry-run; empty = claude           (PERFREPAIR_AGENT)
  claude:                  # keys of the claude gateway; empty = the code default
    auth:                  # subscription (the logged-in CLI) | api (ANTHROPIC_API_KEY); empty = subscription   (PERFREPAIR_AUTH)
    model:                 # empty = claude-opus-5-5                    (PERFREPAIR_MODEL)
    effort:                # low | medium | high | xhigh | max          (PERFREPAIR_EFFORT); empty = assign low, others medium;
                           # a value here raises every role, assign included
    binary:                # the CLI for auth subscription; empty = claude

paths:                     # shared
  prompts:                 # default --prompts of every model-calling command

device:                    # once per device
  screening:               # grouping build, repair dossier, guide, validation
    catalog:               # a screening.yaml; empty = the packaged catalog (logged); a missing file is missing_file
    aiReview: false        # true: grouping build asks screening's classify role about the items no row decides
    classify: {}           # role keys: gateway, model, effort, budget (tokens by chars/4 of the system prompt plus one
                           # message; over it, a coded stop, docs/settings.md)
  grouping:                # grouping assign
    turns:                 # empty = the code default
    sessions:              # empty = the code default
    limit:                 # items per `grouping assign` call; empty = all
    noRerun: true          # guide: true asks only items with no decision; false asks every item into a new outbox
    assign: {}             # role keys: gateway, model, effort, budget; effort here sets this role only
  benchmark:
    onGap: delta           # a used item the benchmark lacks: delta measures only the gaps, once | stop: not_benchmarked
    onSetupMismatch: stop  # a delta measured under another setup: stop names the field | rerun: the whole benchmark again
  filterByApps: true       # guide: group and measure only the items the target apps use and their options; false = every item
  ## to check primitives skipped or stopped due to not downloading them go <device>/log/details/primitives_missing.yaml
  bundled:                 # guide, with filterByApps: providers the target apps ship that the device lacks
    # NOT RECOMMENDED: apply. Prepare providers.bundled yourself before the device run.
    fromApps: off          # off | suggest: write <device>/bundled-suggestions.yaml | apply: also build its matched rows in
  id:                      # the folder under the results root; needed when it holds several; a device not there is an error
  worthiness: {}           # role keys of `ai worthiness`

apps:                      # per app: the guide, `ai replace`
  ## NOT GUARANTEED TO CHECK PARTIAL, OR NON GUARANTEED APPS AND DIRS REQUIRE ANDROID META DATA!!!
  targets: []              # without --app: [{root: dir}, {path: dir, perfMode: ...}, dir] or a file of that list (targets.example.yaml); relative to this file
  perfMode: generic        # generic or all (every metric, overall judgement) | a list of latency, throughput, memAlloc, energy (strict rule)
  limit:                   # scopes the guide asks the model about; empty = all
  measure: false           # true: the guide also measures the harness on the attached phone
  maxChange: drop-in       # highest change class the guide may apply: drop-in | local-edit | migration; higher ones are reported
  agent: {}                # role keys of the guide
  replace: {}              # role keys of `ai replace`
  upgrade: {}              # role keys of `ai upgrade` and the guide's upgrade step

timeouts:                  # seconds a child process may run before it is killed with its children
  claude: 3600             # one claude -p call; past it claude_cli_timeout
  pipeline: 86400          # one pipeline.py call; a device benchmark runs for hours; past it pipeline_timeout

stops:                     # per code, what it does when it fires (docs/stops.md); a fixed code set here is warned about, ignored
  bundled_missing: warn    # warn: logged, the run goes on | stop: before the benchmark, listing each provider
  not_on_device: warn     # warn | stop: a provider an app site names that the device lacks
  perf_mode_unmeasured: stop        # stop | warn: a metric a perfMode list names that the harness cannot measure
  perf_mode_maybe_unmeasured: warn  # warn | stop: selected energy only a test set may turn on
  energy_invalid: warn     # warn | stop: an energy case its energy.json marks invalid
  thermal_mismatch: warn   # warn | stop: a before/after pair whose start temperatures differ past criteria.yaml's thermalMismatchDegrees; no verdict changes
  category_mismatch: warn   # warn | stop: a scope's before/after change, beyond noise, is not one its category's estimates gave
  thermal_throttled_at_end: warn   # warn | stop: a case that ended throttled; no verdict changes
  energy_unreadable: warn  # warn | stop: energy files that cannot be read
  no_required_metric: skip # skip | stop: a benchmark case with no runs of a required metric
  invariant_undecided: warn # warn | stop: before replace, an invariant the app's source does not decide
