# Plan of tools/role_checks.py: the facts to flip and the answers known right, per role; each fill-in comes from the device folder.
flips:
  worthiness:
    - {name: swap-measurements, file: measurements.json, under: byRow, swap: [ROW_ID_A, ROW_ID_B]}
  grouping.assign:
    - {name: change-mgf1, file: grouping/profiles.json, old: "OLD_MGF1_VALUE", new: "NEW_MGF1_VALUE"}
  apps.replace:
    - {name: mark-wire-format, file: "{app}/dossiers.json", old: '"local"', new: '"wire_format"'}
known:
  repair-upgrade:
    ITEM_KEY: {option: R1}
