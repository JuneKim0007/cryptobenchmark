# The predefined groups: one per family, by algorithm id <type>|<canonical> of algorithm-names.yaml; each id's facts and
# contract are its entry in algorithms/<family>_catalogue.yaml, the family's description is families.yaml's. Contract rows
# come from those contracts (groups.py): only a pair in one row can swap without a change. An id with no contract, such as
# OAEP, goes to the model.
schemaVersion: 3
source: canonical names kept by hand; a person adds a name from group-candidates.yaml
groups:
  agreement.peer:
    algorithms:
    - KeyAgreement|DiffieHellman
    - KeyAgreement|ECDH
