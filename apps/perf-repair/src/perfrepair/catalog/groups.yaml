# The predefined groups: one per family. Each algorithm is a canonical name of algorithm-names.yaml; types.yaml holds its
# facts. Contract rows are derived on load (groups.py): only a pair in one row can swap without a change. A name with no
# row, such as OAEP, goes to the model.
schemaVersion: 2
source: canonical names kept by hand; a person adds a name from group-candidates.yaml
groups:
  agreement.peer:
    description: "Key agreement: two key pairs derive one shared secret."
    algorithms:
    - DiffieHellman
    - ECDH
    - X25519
    - X448
    - XDH
  cipher.pair:
    description: "Asymmetric ciphers: a public key encrypts, the private key decrypts."
    algorithms:
    - RSA
    - RSA/ECB/NoPadding
    - RSA/ECB/OAEPPadding
    - RSA/ECB/OAEPWithSHA-1AndMGF1Padding
    - RSA/ECB/OAEPWithSHA-224AndMGF1Padding
    - RSA/ECB/OAEPWithSHA-256AndMGF1Padding
    - RSA/ECB/OAEPWithSHA-384AndMGF1Padding
    - RSA/ECB/OAEPWithSHA-512AndMGF1Padding
    - RSA/ECB/PKCS1Padding
  cipher.secret:
    description: "Symmetric ciphers: one secret key encrypts and decrypts."
    algorithms:
    - AES
    - AES/CBC/NoPadding
    - AES/CBC/PKCS5Padding
    - AES/CFB/NoPadding
    - AES/CTR/NoPadding
    - AES/ECB/NoPadding
    - AES/ECB/PKCS5Padding
    - AES/GCM-SIV/NoPadding
    - AES/GCM/NoPadding
    - AES/KW/NoPadding
    - AES/KW/PKCS5Padding
    - AES/KWP/NoPadding
    - AES/OFB/NoPadding
    - ARCFOUR
    - Blowfish
    - ChaCha20
    - ChaCha20-Poly1305
    - DES
    - DESede
    - DESede/CBC/NoPadding
    - DESede/CBC/PKCS5Padding
    - DESede/ECB/NoPadding
    - DESede/ECB/PKCS5Padding
    - DESedeWrap
    - RC2
  cipher.unknown:
    description: "Ciphers whose key kind no recorded field reveals: password-based and key-wrap transformations."
    algorithms:
    - DESedeWrap
    - PBEWithHmacSHA1AndAES_128
    - PBEWithHmacSHA1AndAES_256
    - PBEWithHmacSHA224AndAES_128
    - PBEWithHmacSHA224AndAES_256
    - PBEWithHmacSHA256AndAES_128
    - PBEWithHmacSHA256AndAES_256
    - PBEWithHmacSHA384AndAES_128
    - PBEWithHmacSHA384AndAES_256
    - PBEWithHmacSHA512/224AndAES_128
    - PBEWithHmacSHA512/224AndAES_256
    - PBEWithHmacSHA512/256AndAES_128
    - PBEWithHmacSHA512/256AndAES_256
    - PBEWithHmacSHA512AndAES_128
    - PBEWithHmacSHA512AndAES_256
    - PBEWITHMD5AND128BITAES-CBC-OPENSSL
    - PBEWITHMD5AND192BITAES-CBC-OPENSSL
    - PBEWITHMD5AND256BITAES-CBC-OPENSSL
    - PBEWithMD5AndDES
    - PBEWithMD5AndRC2
    - PBEWithMD5AndTripleDES
    - PBEWithSHA1AndDES
    - PBEWithSHA1AndDESede
    - PBEWithSHA1AndRC2
    - PBEWithSHA1AndRC2_128
    - PBEWithSHA1AndRC2_40
    - PBEWithSHA1AndRC4_128
    - PBEWithSHA1AndRC4_40
    - PBEWITHSHA256AND128BITAES-CBC-BC
    - PBEWITHSHA256AND192BITAES-CBC-BC
    - PBEWITHSHA256AND256BITAES-CBC-BC
    - PBEWITHSHAAND128BITAES-CBC-BC
    - PBEWITHSHAAND192BITAES-CBC-BC
    - PBEWITHSHAAND2-KEYTRIPLEDES-CBC
    - PBEWITHSHAAND256BITAES-CBC-BC
    - PBEWITHSHAANDTWOFISH-CBC
  digest.none:
    description: "Hash functions: a message gives a digest, with no key."
    algorithms:
    - GOST3411
    - MD2
    - MD5
    - SHA-1
    - SHA-224
    - SHA-256
    - SHA-384
    - SHA-512
    - SHA-512/224
    - SHA-512/256
    - SHA3-224
    - SHA3-256
    - SHA3-384
    - SHA3-512
    - SHAKE128-256
    - SHAKE256-512
  keygen.none:
    description: "Secret key generators: each produces a key for a cipher or MAC."
    algorithms:
    - AES
    - ARCFOUR
    - Blowfish
    - ChaCha20
    - DES
    - DESede
    - HmacMD5
    - HmacSHA1
    - HmacSHA224
    - HmacSHA256
    - HmacSHA3-224
    - HmacSHA3-256
    - HmacSHA3-384
    - HmacSHA3-512
    - HmacSHA384
    - HmacSHA512
    - HmacSHA512/224
    - HmacSHA512/256
    - RC2
    - SunTls12Prf
    - SunTlsKeyMaterial
    - SunTlsMasterSecret
    - SunTlsPrf
    - SunTlsRsaPremasterSecret
  keypairgen.none:
    description: "Key pair generators: each produces a public and private key."
    algorithms:
    - DiffieHellman
    - DSA
    - EC
    - Ed25519
    - Ed448
    - EdDSA
    - ML-DSA
    - ML-DSA-44
    - ML-DSA-65
    - ML-DSA-87
    - ML-KEM
    - ML-KEM-1024
    - ML-KEM-512
    - ML-KEM-768
    - RSA
    - RSASSA-PSS
    - X25519
    - X448
    - XDH
  mac.secret:
    description: "Message authentication codes: a secret key and a message give a tag."
    algorithms:
    - AESCMAC
    - HmacMD5
    - HmacPBESHA1
    - HmacPBESHA224
    - HmacPBESHA256
    - HmacPBESHA384
    - HmacPBESHA512
    - HmacPBESHA512/224
    - HmacPBESHA512/256
    - HmacSHA1
    - HmacSHA224
    - HmacSHA256
    - HmacSHA3-224
    - HmacSHA3-256
    - HmacSHA3-384
    - HmacSHA3-512
    - HmacSHA384
    - HmacSHA512
    - HmacSHA512/224
    - HmacSHA512/256
    - PBEWITHHMACSHA
    - PBEWithHmacSHA1
    - PBEWithHmacSHA224
    - PBEWithHmacSHA256
    - PBEWithHmacSHA384
    - PBEWithHmacSHA512
    - PBEWithHmacSHA512/224
    - PBEWithHmacSHA512/256
    - SslMacMD5
    - SslMacSHA1
  signature.pair:
    description: "Signatures: a private key signs, the public key verifies."
    algorithms:
    - Ed25519
    - Ed448
    - EdDSA
    - HSS/LMS
    - MD2withRSA
    - MD5andSHA1withRSA
    - MD5withRSA
    - ML-DSA
    - ML-DSA-44
    - ML-DSA-65
    - ML-DSA-87
    - NONEwithDSA
    - NONEwithDSAinP1363Format
    - NONEwithECDSA
    - NONEwithECDSAinP1363Format
    - NONEwithRSA
    - RSASSA-PSS
    - SHA1withDSA
    - SHA1withDSAinP1363Format
    - SHA1withECDSA
    - SHA1withECDSAinP1363Format
    - SHA1withRSA
    - SHA1withRSA/PSS
    - SHA224withDSA
    - SHA224withDSAinP1363Format
    - SHA224withECDSA
    - SHA224withECDSAinP1363Format
    - SHA224withRSA
    - SHA224withRSA/PSS
    - SHA256withDSA
    - SHA256withDSAinP1363Format
    - SHA256withECDSA
    - SHA256withECDSAinP1363Format
    - SHA256withRSA
    - SHA256withRSA/PSS
    - SHA3-224withDSA
    - SHA3-224withDSAinP1363Format
    - SHA3-224withECDSA
    - SHA3-224withECDSAinP1363Format
    - SHA3-224withRSA
    - SHA3-256withDSA
    - SHA3-256withDSAinP1363Format
    - SHA3-256withECDSA
    - SHA3-256withECDSAinP1363Format
    - SHA3-256withRSA
    - SHA3-384withDSA
    - SHA3-384withDSAinP1363Format
    - SHA3-384withECDSA
    - SHA3-384withECDSAinP1363Format
    - SHA3-384withRSA
    - SHA3-512withDSA
    - SHA3-512withDSAinP1363Format
    - SHA3-512withECDSA
    - SHA3-512withECDSAinP1363Format
    - SHA3-512withRSA
    - SHA384withDSA
    - SHA384withDSAinP1363Format
    - SHA384withECDSA
    - SHA384withECDSAinP1363Format
    - SHA384withRSA
    - SHA384withRSA/PSS
    - SHA512/224withRSA
