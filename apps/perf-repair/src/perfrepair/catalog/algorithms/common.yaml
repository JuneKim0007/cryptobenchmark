# What every catalogue cites: sources by id, SP 800-57 strength tables, and the output kinds a caller relies on.
# strengthBits: an integer, {key: <keyStrength map>} for a key-size fact, {key, cap} for min(cap, key), or null (unknown).
# minSdk: the first level of the open-ended range on the reference page ("1-8,22+" is 22); null: check the device.
schemaVersion: 1
sources:
  SP80057T2: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf
  SP80057T3: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf
  RFC6151: https://www.rfc-editor.org/rfc/rfc6151
  RFC6149: https://www.rfc-editor.org/rfc/rfc6149
  RFC7465: https://www.rfc-editor.org/rfc/rfc7465
  RFC7748: https://www.rfc-editor.org/rfc/rfc7748
  RFC8032: https://www.rfc-editor.org/rfc/rfc8032
  RFC8439: https://www.rfc-editor.org/rfc/rfc8439
  FIPS46: https://csrc.nist.gov/pubs/fips/46-3/final
  ACIPHER: https://developer.android.com/reference/javax/crypto/Cipher
  AMAC: https://developer.android.com/reference/javax/crypto/Mac
  ADIGEST: https://developer.android.com/reference/java/security/MessageDigest
  ASIGNATURE: https://developer.android.com/reference/java/security/Signature
  AKEYGEN: https://developer.android.com/reference/javax/crypto/KeyGenerator
  AKEYPAIRGEN: https://developer.android.com/reference/java/security/KeyPairGenerator
  AAGREEMENT: https://developer.android.com/reference/javax/crypto/KeyAgreement
# SP 800-57 Part 1 r5 Table 2: comparable strengths by key size; a size between rows takes the row below it
keyStrength:
  aes: {source: SP80057T2, bits: {128: 128, 192: 192, 256: 256}}
  ifc: {source: SP80057T2, bits: {1024: 80, 2048: 112, 3072: 128, 7680: 192, 15360: 256}}
  ecc: {source: SP80057T2, bits: {160: 80, 224: 112, 256: 128, 384: 192, 512: 256}}
# output kinds whose bytes a caller may compare or look up, so a candidate that loses determinism there is rejected
deterministicRelied:
- digest
- tag
- ciphertext
- aead_ciphertext
- shared_secret
