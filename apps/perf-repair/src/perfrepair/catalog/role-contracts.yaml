# One row per AI role: its prompt, schema, the files that may feed its message, its tools, and what it may write.
# `charter` pins prompt, schema and correction (the charter with no run inputs); `folder` holds the engine's own files.
schemaVersion: 1
roles:
  screening.classify:
    prompt: parse/algorithm-classify
    schema: ai.parse.algorithm_classify.schema
    charter: "015896b12137"
    folder: grouping/classify
    required: [grouping/classify/batches.json]
    optional: []
    tools: []
    writes: [grouping/classify/batches.json, grouping/classify/classified.json, grouping/registry-candidates.yaml]
  grouping.assign:
    prompt: parse/grouping-assign
    schema: ai.parse.grouping_assign.schema
    charter: "f86357f95b6f"
    folder: grouping
    required: [grouping/items.json, grouping/profiles.json, catalog/families.yaml, catalog/groups.yaml, catalog/interchange.yaml]
    optional: [grouping/screen.json, used.json, catalog/algorithm-names.yaml, "catalog/algorithms/*"]
    tools: []
    writes: [grouping/knowledge.json, grouping/cursor.json]
  worthiness:
    prompt: evaluate/worthiness
    schema: ai.evaluate.worthiness.schema
    charter: "40a95eb16068"
    folder: "worthiness-{mode}"
    required: [rows.json, measurements.json, grouping/groups.json, grouping/items.json, grouping/profiles.json]
    optional: [grouping/screen.json, manifest.yaml, catalog/groups.yaml, "catalog/algorithms/*", catalog/algorithm-names.yaml, catalog/families.yaml, catalog/interchange.yaml]
    tools: []
    writes: ["worthiness-{mode}/evidence.json", "worthiness-{mode}/verdicts.json"]
  apps.replace:
    prompt: suggest/site-replace
    schema: ai.suggest.site_replace.schema
    charter: "98e94c289e25"
    folder: "{app}/replace"
    required: ["{app}/dossiers.json"]
    optional: [primitives.tsv, measurements.json, manifest.yaml]
    tools: []
    writes: ["{app}/replacements.json"]
  repair-upgrade:
    prompt: repair/upgrade
    schema: ai.repair.upgrade.schema
    charter: "90e29369036e"
    folder: "{app}/upgrade"
    required: ["{app}/dossiers.json"]
    optional: []
    tools: []
    writes: ["{app}/upgrades.json"]
  review.stability:
    prompt: suggest/site-replace
    schema: ai.suggest.site_replace.schema
    charter: "98e94c289e25"
    folder: review/stability
    required: ["*/dossiers.json"]
    optional: [primitives.tsv, measurements.json, manifest.yaml]
    tools: []
    writes: [review/stability.json]
