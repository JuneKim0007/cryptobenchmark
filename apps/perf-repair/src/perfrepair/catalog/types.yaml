# Per (family, canonical name): the output kind and properties of what the call returns, its security strength and the
# Android API level from which the platform provides it. Read by result/change.py; fields and rules: docs/grouping.md.
# strengthBits: an integer, {key: <keyStrength map>} for a key-size fact, {key, cap} for min(cap, key), or null (unknown).
# minSdk: the first level of the open-ended range on the reference page ("1-8,22+" is 22); null: check the device.
schemaVersion: 1
sources:
  SP80057T2: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf
  SP80057T3: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf
  RFC6151: https://www.rfc-editor.org/rfc/rfc6151
  RFC6149: https://www.rfc-editor.org/rfc/rfc6149
  RFC7465: https://www.rfc-editor.org/rfc/rfc7465
  RFC7748: https://www.rfc-editor.org/rfc/rfc7748
  RFC8032: https://www.rfc-editor.org/rfc/rfc8032
  RFC8439: https://www.rfc-editor.org/rfc/rfc8439
  FIPS46: https://csrc.nist.gov/pubs/fips/46-3/final
  ACIPHER: https://developer.android.com/reference/javax/crypto/Cipher
  AMAC: https://developer.android.com/reference/javax/crypto/Mac
  ADIGEST: https://developer.android.com/reference/java/security/MessageDigest
  ASIGNATURE: https://developer.android.com/reference/java/security/Signature
  AKEYGEN: https://developer.android.com/reference/javax/crypto/KeyGenerator
  AKEYPAIRGEN: https://developer.android.com/reference/java/security/KeyPairGenerator
  AAGREEMENT: https://developer.android.com/reference/javax/crypto/KeyAgreement
# SP 800-57 Part 1 r5 Table 2: comparable strengths by key size; a size between rows takes the row below it
keyStrength:
  aes: {source: SP80057T2, bits: {128: 128, 192: 192, 256: 256}}
  ifc: {source: SP80057T2, bits: {1024: 80, 2048: 112, 3072: 128, 7680: 192, 15360: 256}}
  ecc: {source: SP80057T2, bits: {160: 80, 224: 112, 256: 128, 384: 192, 512: 256}}
# output kinds whose bytes a caller may compare or look up, so a candidate that loses determinism there is rejected
deterministicRelied: [digest, tag, ciphertext, aead_ciphertext, shared_secret]
families:
  digest.none:
    defaults: {outputKind: digest, authenticated: false, deterministic: true, nonceRequired: none, parameters: none,
               keyType: none, strengthSource: SP80057T3, minSdkSource: ADIGEST}
    rows:
      MD2: {outputBytes: 16, strengthBits: 0, strengthSource: RFC6149, minSdk: null}
      MD5: {outputBytes: 16, strengthBits: 0, strengthSource: RFC6151, minSdk: 1}
      # Table 3 gives SHA-1 at most 80 for signatures and hash-only use
      SHA-1: {outputBytes: 20, strengthBits: 80, minSdk: 1}
      SHA-224: {outputBytes: 28, strengthBits: 112, minSdk: 22}
      SHA-512/224: {outputBytes: 28, strengthBits: 112, minSdk: null}
      SHA3-224: {outputBytes: 28, strengthBits: 112, minSdk: null}
      SHA-256: {outputBytes: 32, strengthBits: 128, minSdk: 1}
      SHA-512/256: {outputBytes: 32, strengthBits: 128, minSdk: null}
      SHA3-256: {outputBytes: 32, strengthBits: 128, minSdk: null}
      SHA-384: {outputBytes: 48, strengthBits: 192, minSdk: 1}
      SHA3-384: {outputBytes: 48, strengthBits: 192, minSdk: null}
      SHA-512: {outputBytes: 64, strengthBits: 256, minSdk: 1}
      SHA3-512: {outputBytes: 64, strengthBits: 256, minSdk: null}
  mac.secret:
    defaults: {outputKind: tag, authenticated: true, deterministic: true, nonceRequired: none, parameters: none,
               keyType: HMAC, strengthSource: SP80057T3, minSdkSource: AMAC}
    rows:
      HmacMD5: {outputBytes: 16, strengthBits: null, strengthSource: unsourced, minSdk: 1}
      HmacSHA1: {outputBytes: 20, strengthBits: 128, minSdk: 1}
      HmacSHA224: {outputBytes: 28, strengthBits: 192, minSdk: 22}
      HmacSHA512/224: {outputBytes: 28, strengthBits: 192, minSdk: null}
      HmacSHA3-224: {outputBytes: 28, strengthBits: 192, minSdk: null}
      HmacSHA256: {outputBytes: 32, strengthBits: 256, minSdk: 1}
      HmacSHA512/256: {outputBytes: 32, strengthBits: 256, minSdk: null}
      HmacSHA3-256: {outputBytes: 32, strengthBits: 256, minSdk: null}
      HmacSHA384: {outputBytes: 48, strengthBits: 256, minSdk: 1}
      HmacSHA3-384: {outputBytes: 48, strengthBits: 256, minSdk: null}
      HmacSHA512: {outputBytes: 64, strengthBits: 256, minSdk: 1}
      HmacSHA3-512: {outputBytes: 64, strengthBits: 256, minSdk: null}
      AESCMAC: {outputBytes: 16, keyType: AES, strengthBits: {key: aes}, strengthSource: SP80057T2, minSdk: 31}
      SslMacMD5: {outputBytes: 16, strengthBits: null, strengthSource: unsourced, minSdk: null}
      SslMacSHA1: {outputBytes: 20, strengthBits: null, strengthSource: unsourced, minSdk: null}
      PBEWITHHMACSHA: {outputBytes: 20, keyType: PBE, parameters: pbe, strengthBits: null, strengthSource: unsourced, minSdk: 1}
      PBEWithHmacSHA1: {outputBytes: 20, keyType: PBE, parameters: pbe, strengthBits: null, strengthSource: unsourced, minSdk: 1}
  cipher.secret:
    defaults: {outputKind: ciphertext, authenticated: false, deterministic: false, nonceRequired: unpredictable,
               parameters: iv, outputBytes: null, keyType: AES, strengthBits: {key: aes}, strengthSource: SP80057T2,
               minSdkSource: ACIPHER}
    rows:
      AES: {deterministic: true, nonceRequired: none, parameters: none, minSdk: 1}
      AES/ECB/NoPadding: {deterministic: true, nonceRequired: none, parameters: none, minSdk: 1}
      AES/ECB/PKCS5Padding: {deterministic: true, nonceRequired: none, parameters: none, minSdk: 1}
      AES/CBC/NoPadding: {minSdk: 1}
      AES/CBC/PKCS5Padding: {minSdk: 1}
      AES/CFB/NoPadding: {minSdk: 1}
      AES/OFB/NoPadding: {nonceRequired: unique, minSdk: 1}
      AES/CTR/NoPadding: {nonceRequired: unique, minSdk: 1}
      AES/GCM/NoPadding: {outputKind: aead_ciphertext, authenticated: true, nonceRequired: unique, parameters: gcm, minSdk: 10}
      AES/GCM-SIV/NoPadding: {outputKind: aead_ciphertext, authenticated: true, nonceRequired: unique, parameters: gcm, minSdk: 30}
      AES/KW/NoPadding: {authenticated: true, deterministic: true, nonceRequired: none, parameters: none, minSdk: null}
      AES/KW/PKCS5Padding: {authenticated: true, deterministic: true, nonceRequired: none, parameters: none, minSdk: null}
      AES/KWP/NoPadding: {authenticated: true, deterministic: true, nonceRequired: none, parameters: none, minSdk: null}
      ChaCha20: {keyType: ChaCha20, nonceRequired: unique, parameters: chacha, strengthBits: 256, strengthSource: RFC8439, minSdk: 28}
      ChaCha20-Poly1305: {outputKind: aead_ciphertext, authenticated: true, keyType: ChaCha20, nonceRequired: unique,
                          strengthBits: 256, strengthSource: RFC8439, minSdk: 28}
      DES: {keyType: DES, deterministic: true, nonceRequired: none, parameters: none, strengthBits: 56, strengthSource: FIPS46, minSdk: 1}
      DESede: {keyType: DESede, deterministic: true, nonceRequired: none, parameters: none, strengthBits: 112, minSdk: 1}
      DESede/CBC/NoPadding: {keyType: DESede, strengthBits: 112, minSdk: 1}
      DESede/CBC/PKCS5Padding: {keyType: DESede, strengthBits: 112, minSdk: 1}
      DESede/ECB/NoPadding: {keyType: DESede, deterministic: true, nonceRequired: none, parameters: none, strengthBits: 112, minSdk: 1}
      DESede/ECB/PKCS5Padding: {keyType: DESede, deterministic: true, nonceRequired: none, parameters: none, strengthBits: 112, minSdk: 1}
      DESedeWrap: {keyType: DESede, authenticated: true, nonceRequired: none, strengthBits: 112, minSdk: null}
      ARCFOUR: {keyType: ARCFOUR, deterministic: true, nonceRequired: none, parameters: none, strengthBits: 0, strengthSource: RFC7465, minSdk: 10}
      Blowfish: {keyType: Blowfish, deterministic: true, nonceRequired: none, parameters: none, strengthBits: null, strengthSource: unsourced, minSdk: 10}
      RC2: {keyType: RC2, deterministic: true, nonceRequired: none, parameters: none, strengthBits: null, strengthSource: unsourced, minSdk: null}
  cipher.pair:
    defaults: {outputKind: ciphertext, authenticated: false, deterministic: false, nonceRequired: none, parameters: none,
               outputBytes: null, keyType: RSA, strengthBits: {key: ifc}, strengthSource: SP80057T2, minSdkSource: ACIPHER}
    rows:
      RSA: {minSdk: 1}
      RSA/ECB/NoPadding: {deterministic: true, minSdk: 1}
      RSA/ECB/PKCS1Padding: {minSdk: 1}
      RSA/ECB/OAEPPadding: {minSdk: 1}
      RSA/ECB/OAEPWithSHA-1AndMGF1Padding: {minSdk: 10}
      RSA/ECB/OAEPWithSHA-224AndMGF1Padding: {minSdk: 23}
      RSA/ECB/OAEPWithSHA-256AndMGF1Padding: {minSdk: 10}
      RSA/ECB/OAEPWithSHA-384AndMGF1Padding: {minSdk: 23}
      RSA/ECB/OAEPWithSHA-512AndMGF1Padding: {minSdk: 23}
  # password-based and wrap names: a password's strength is no key-size fact
  cipher.unknown:
    defaults: {outputKind: ciphertext, authenticated: false, deterministic: false, nonceRequired: none, parameters: pbe,
               outputBytes: null, keyType: PBE, strengthBits: null, strengthSource: unsourced, minSdkSource: ACIPHER, minSdk: null}
    rows:
      DESedeWrap: {keyType: DESede, authenticated: true, parameters: none, strengthBits: 112, strengthSource: SP80057T2}
