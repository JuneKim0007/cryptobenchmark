# The 8 families say what an algorithm is; whether two can swap comes from the contract rows of groups.yaml, not from here.
# Agents may not change these descriptions; prompts read them. Key kind: secret | pair | none | peer. An engine type with one
# family has that key kind; Cipher's comes from the catalogue, else from evidence (grouping/build/key_kind.py).
# unidentified sits outside the families: no engine type, no catalogue, no contract, so it is never a swap candidate.
schemaVersion: 1
families:
- {id: cipher.secret, type: Cipher, keyKind: secret,
   description: "Symmetric ciphers: one secret key, or a key derived from a password, encrypts and decrypts."}
- {id: cipher.pair, type: Cipher, keyKind: pair,
   description: "Asymmetric ciphers: a public key encrypts, the private key decrypts."}
- {id: signature.pair, type: Signature, keyKind: pair,
   description: "Signatures: a private key signs, the public key verifies."}
- {id: mac.secret, type: Mac, keyKind: secret,
   description: "Message authentication codes: one secret key computes and checks a tag."}
- {id: digest.none, type: MessageDigest, keyKind: none,
   description: "Hash functions: no key; the same input gives the same fixed-size output."}
- {id: keygen.none, type: KeyGenerator, keyKind: none,
   description: "Secret key generators: each call produces a new symmetric key."}
- {id: keypairgen.none, type: KeyPairGenerator, keyKind: none,
   description: "Key pair generators: each call produces a new public and private key."}
- {id: agreement.peer, type: KeyAgreement, keyKind: peer,
   description: "Key agreement: two parties derive one shared secret from their private key and the other's public key."}
unidentified: {id: unidentified, type: any, keyKind: unknown,
               description: "Not identified: no catalogue entry and no key evidence place it in a family, so nothing about what it does is known."}
