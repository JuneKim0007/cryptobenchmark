# Names a function may use without defining them: keywords, primitive types, and what each language puts in scope implicitly.
# java_lang: public top-level classes of android.jar's java.lang; scripts/scope/languages.py holds the same set, a test compares them.
java_lang: [AbstractMethodError, Appendable, ArithmeticException, ArrayIndexOutOfBoundsException,
            ArrayStoreException, AssertionError, AutoCloseable, Boolean, BootstrapMethodError, Byte,
            CharSequence, Character, Class, ClassCastException, ClassCircularityError, ClassFormatError,
            ClassLoader, ClassNotFoundException, ClassValue, CloneNotSupportedException, Cloneable, Comparable,
            Compiler, Deprecated, Double, Enum, EnumConstantNotPresentException, Error, Exception,
            ExceptionInInitializerError, Float, FunctionalInterface, IllegalAccessError,
            IllegalAccessException, IllegalArgumentException, IllegalMonitorStateException,
            IllegalStateException, IllegalThreadStateException, IncompatibleClassChangeError,
            IndexOutOfBoundsException, InheritableThreadLocal, InstantiationError, InstantiationException,
            Integer, InternalError, InterruptedException, Iterable, LinkageError, Long, MatchException, Math,
            NegativeArraySizeException, NoClassDefFoundError, NoSuchFieldError, NoSuchFieldException,
            NoSuchMethodError, NoSuchMethodException, NullPointerException, Number, NumberFormatException,
            Object, OutOfMemoryError, Override, Package, Process, ProcessBuilder, Readable, Record,
            ReflectiveOperationException, Runnable, Runtime, RuntimeException, RuntimePermission, SafeVarargs,
            SecurityException, SecurityManager, Short, StackOverflowError, StackTraceElement, StackWalker,
            StrictMath, String, StringBuffer, StringBuilder, StringIndexOutOfBoundsException, SuppressWarnings,
            System, Thread, ThreadDeath, ThreadGroup, ThreadLocal, Throwable, TypeNotPresentException,
            UnknownError, UnsatisfiedLinkError, UnsupportedClassVersionError, UnsupportedOperationException,
            VerifyError, VirtualMachineError, Void]
java:
  keywords: [abstract, assert, break, case, catch, class, continue, default, do, else, enum, extends, final, finally,
             for, if, implements, import, instanceof, interface, native, new, package, private, protected, public,
             return, static, strictfp, super, switch, synchronized, this, throw, throws, transient, try, volatile,
             while, var, yield, record, "null", "true", "false"]
  types: [boolean, byte, char, short, int, long, float, double, void, var, final]
  implicit: [java, javax]
  extensions: false
kotlin:
  # an import can serve a call with no such name in the text: `by`, operators, destructuring; and a member-looking extension
  extensions: true
  conventions: [getValue, setValue, provideDelegate, plus, minus, times, div, rem, unaryPlus, unaryMinus, inc, dec, not,
                contains, get, set, invoke, iterator, hasNext, next, rangeTo, compareTo, component1, component2,
                component3, component4, component5]
  keywords: [as, break, class, continue, do, else, "false", for, fun, if, in, interface, is, "null", object, package,
             return, super, this, throw, "true", try, typealias, val, var, when, while, catch, finally, by, constructor,
             init, where, override, private, protected, public, internal, open, data, inline, suspend, lateinit, const,
             companion, sealed, abstract, final, vararg, import, get, set, field]
  types: [val, var]
  implicit: [java, javax, kotlin, it, String, Any, Unit, Nothing, Int, Long, Short, Byte, Char, Boolean, Float, Double,
             ByteArray, IntArray, CharArray, Array, List, Map, Set, MutableList, MutableMap, Exception, RuntimeException,
             Throwable, IllegalArgumentException, IllegalStateException, Charsets, Throws, JvmStatic, println, require,
             check, error, arrayOf, byteArrayOf, listOf, mapOf, setOf, mutableListOf, mutableMapOf, emptyList,
             emptyMap, lazy, also, apply, let, run, with, repeat, TODO]
