# Every code once. kind: error | notice | outcome (a stored verdict or reason); default: the action today, where a reader resolves it.
# stops: perf-repair's stops.<code> entry, in its table's order: the actions it may choose, exit, next step, why.
schemaVersion: 1
codes:
  bundled_missing:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "add the providers to providers.bundled in global.yaml, or set device.bundled.fromApps"
      why: ""
  not_on_device:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "add it to providers.bundled in global.yaml and rerun the device stage"
      why: ""
  perf_mode_unmeasured:
    kind: error
    default: stop
    stops:
      settable: [stop, warn]
      exit: 1
      next: "measure on a device (guide --device), or drop the metric from apps.perfMode"
      why: ""
  perf_mode_maybe_unmeasured:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "set run.harness.energy.capture: measured, or rely on the test set"
      why: ""
  energy_invalid:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "the case has no energy number; rerun it with a longer window or more operations"
      why: ""
  energy_unreadable:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "check the energy.json files the manifest lists"
      why: ""
  thermal_throttled_at_end:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "the case ended throttled; let the phone cool, or read its numbers with care"
      why: ""
  no_required_metric:
    kind: error
    default: skip
    stops:
      settable: [skip, stop]
      exit: 1
      next: "the case has no required metric runs; check the benchmark transcript"
      why: ""
  variant_unrepaired:
    kind: error
    default: skip
    stops:
      settable: [skip, stop]
      exit: 1
      next: "the case measures a path no call site pattern maps to; its numbers stay in benchmark.json, perf-repair leaves it out"
      why: ""
  invariant_undecided:
    kind: error
    default: warn
    stops:
      settable: [warn, stop]
      exit: 1
      next: "the source does not decide a rule; run python3 -m perfrepair.validation.invariants on the device folder and check each undecided finding by hand"
      why: ""
  run_metrics_overridden:
    kind: notice
    default: warn
    stops:
      settable: []
      exit: 1
      next: "remove run.metrics from the run config; apps.perfMode decides what is measured"
      why: "a notice; nothing to choose"
  missing_dependency:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "pip install -r requirements.txt"
      why: "the input is unusable"
  screening_catalog_mismatch:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "rerun grouping build, or set device.screening.catalog to the catalog screen.json names"
      why: "continuing would mix runs or devices"
  charter_mismatch:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "move the outbox aside or restore the prompts it was made with"
      why: "continuing would mix runs or devices"
  missing_device_stage:
