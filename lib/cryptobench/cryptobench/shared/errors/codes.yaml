  unknown_key:
    kind: notice
    default: warn
    stops:
      settable: []
      exit: 1
      next: "remove the key, or fix its spelling"
      why: "a notice; nothing to choose"
  alias_conflict:
    kind: notice
    default: warn
    stops:
      settable: []
      exit: 1
      next: "nothing; a catalogued name keeps the catalog's function, any other is asked; settle the alias in algorithm-names.yaml"
      why: "a notice; nothing to choose"
