  primitive_line_collision:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "rerun the inbound stage (or the guide's device stage)"
      why: "the input is unusable"
  primitive_not_screened:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "grouping/items.json and the benchmark are from different runs; rerun the device stage"
      why: "the input is unusable"
  review_verdict:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "fill the verdict column with one of the listed values"
      why: "the input is unusable"
  run_context:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "report it"
      why: "the input is unusable"
  run_unknown:
    kind: error
    default: stop
    stops:
      settable: []
      exit: 1
      next: "name a run log summary lists"
      why: "the input is unusable"
