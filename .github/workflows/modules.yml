name: modules

# Each module is built alone against its own example/ files: snakeyaml, JUnit, and settings sources except discovery.
# A module that reaches into another stops compiling here; benchmark also compiles with preparation.
# architecture checks layers.yaml over the compiled classes against its frozen store; handoff checks androidTest and cli.
on:
  push:
    branches: ['master', 'module/**']
  pull_request:
  workflow_dispatch:

jobs:
  isolated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [jca, discovery, config, preparation, benchmark, architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ../../apps/benchmark/gradlew -p . :${{ matrix.module }}:test --no-daemon
        working-directory: tools/module-isolation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.module }}-test-results
          path: tools/module-isolation/${{ matrix.module }}/build/reports/tests/test

  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -e ./lib/cryptobench 'PyYAML>=6' 'pytest>=8'
      - run: python3 tools/module-isolation/handoff_check.py
      - run: python3 -m pytest tools/module-isolation/tests
