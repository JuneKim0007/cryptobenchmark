name: modules

# Each module is built alone against its own example/ files: snakeyaml, JUnit, and settings sources except discovery.
# A module that reaches into another stops compiling here; benchmark also compiles with preparation.
on:
  push:
    branches: ['master', 'module/**']
  pull_request:
  workflow_dispatch:

jobs:
  isolated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [discovery, config, preparation, benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ../../apps/benchmark/gradlew -p . :${{ matrix.module }}:test --no-daemon
        working-directory: tools/module-isolation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.module }}-test-results
          path: tools/module-isolation/${{ matrix.module }}/build/reports/tests/test
