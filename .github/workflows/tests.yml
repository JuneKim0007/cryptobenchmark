name: tests

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.txt
      - name: perf-repair
        run: make -C apps/perf-repair check
      - name: runner, cli and tools
        run: python3 -m pytest apps/benchmark-runner/tests apps/benchmark-runner/energy/tests apps/benchmark-runner/analysis/tests apps/cli/tests tools/tests
      - name: paths check
        run: python3 tools/paths_check.py
      - name: standalone
        run: |
          python3 apps/benchmark-runner/tests/test_manifest.py
          python3 apps/benchmark-runner/analysis/tests/test_analyze.py

  root-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # the versions apps/benchmark/modules/android/build.gradle names
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
      - run: ./gradlew build :android:compileReleaseAndroidTestKotlin --no-daemon
        working-directory: apps/benchmark

  end-to-end-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m pip install -r requirements.txt
      # every known-answer case once on JDK + BundledBC, vectors from algorithms/vectors; fails on any failed or errored case
      - run: python3 apps/benchmark-runner/pipeline.py --config config/global-check.yaml --results "$RUNNER_TEMP/check" --bench --check
