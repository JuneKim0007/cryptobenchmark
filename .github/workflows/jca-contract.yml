name: jca contract

# Fails when the JCA surface :discovery reads changes under a new Java version.
on:
  push:
    paths: ['modules/environment/discovery/**', 'modules/settings/**', 'modules/config/**', 'modules/preparation/**', 'modules/benchmark/**', 'apps/perf-repair/src/perfrepair/catalog/algorithm-names.yaml', 'apps/perf-repair/tests/fixtures/algorithm-names-cases.yaml', 'config/**', 'tools/**', 'gradle/wrapper/**', '.github/workflows/jca-contract.yml']
  pull_request:
    paths: ['modules/environment/discovery/**', 'modules/settings/**', 'modules/config/**', 'modules/preparation/**', 'modules/benchmark/**', 'apps/perf-repair/src/perfrepair/catalog/algorithm-names.yaml', 'apps/perf-repair/tests/fixtures/algorithm-names-cases.yaml', 'config/**', 'tools/**', 'gradle/wrapper/**', '.github/workflows/jca-contract.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ../../gradlew -p . test --no-daemon
        working-directory: tools/jca-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-java-${{ matrix.java }}
          path: tools/jca-contract/build/capture/*.yaml

  android-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - run: ../../gradlew -p . compileKotlin --no-daemon -PandroidJar="$ANDROID_HOME/platforms/android-36/android.jar"
        working-directory: tools/android-api-check
