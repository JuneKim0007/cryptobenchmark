name: docs

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -e ./lib/cryptobench
      - name: Docs lint
        run: python3 tools/docs_lint.py
      - name: Shared-functions indexes match the code
        run: python3 tools/shared_functions.py --check
