schemaVersion: 1                 # required
selection:                       # required
  testSet: testsets/smoke.yaml   # required
run:                             # optional
  inputSizes: [1024]             # optional, default [1024]
  phases: [WARM]                 # optional, default [WARM]
  metrics: [TIME]                # optional, default [TIME]
  processRepetitions: 1          # optional, default 1
  seed: 42                       # optional, default 0
  # harness: omitted — optional, the harness's own defaults apply
policy:                          # optional
  onFailure: skip                # optional, default skip
# analysis: omitted — optional, headline auto at 5% CoV (see global.yaml)
