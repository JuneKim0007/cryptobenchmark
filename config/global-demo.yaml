schemaVersion: 1                 # required
selection:                       # required
  testSet: testsets/smoke.yaml   # required
run:                             # required: orderSeed
  variants: [fixed, notFixed]     # optional, default [fixed, notFixed, secure]; secure runs key generation only
  inputSizes: [1024]             # optional, default [1024]
  phases: [WARM]                 # optional, default [WARM]
  metrics: [TIME]                # optional, default [TIME]
  processRepetitions: 1          # optional, default 1
  seed: 42                       # optional, default 0
  orderSeed: 20261115             # required — each process, device or host, shuffles the case order from (orderSeed, repetition)
  # harness: omitted — optional, the harness's own defaults apply
policy:                          # optional
  onFailure: skip                # optional, default skip
# analysis: omitted — optional, headline auto at 5% CoV (see apps/benchmark/modules/config/docs/config.md)
