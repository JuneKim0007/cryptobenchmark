# Schema — required: schemaVersion. Everything else is optional.
#   description  free text
#   include      rules {provider?, type?, name?, group?, variants?}; at least one of provider|type|name; empty = whole inventory; name accepts *
#   exclude      same rule shape without variants; exclude always wins
#   overrides    [{match: rule (required), set: (required) {keySizes?, inputSizes?, key?, parameters?, operations?, variants?, harness?}}]
#   group        optional, only with a name: one primitive measured more than once with different parameters (not the chart group)
schemaVersion: 1                 # required
description: every inventory primitive at provider-chosen parameters, with one row of its own settings as an example

# rows without variants take run.variants; one provider-less rule per JCA type adds every primitive no row names
include:
  - {type: Cipher, name: AES/GCM/NoPadding, variants: [fixed, notFixed]}   # example: one primitive on its own paths
  - {type: Cipher}
  - {type: KeyAgreement}
  - {type: KeyGenerator}
  - {type: KeyPairGenerator}
  - {type: Mac}
  - {type: MessageDigest}
  - {type: Signature}

overrides:
  - match: {type: Cipher, name: AES/GCM/NoPadding}                         # example: that primitive's own settings
    set: {keySizes: [128, 256], operations: [ENCRYPT, DECRYPT], inputSizes: [1024]}
