# What a run measures. Everything not written here takes its default: every key is in apps/benchmark/modules/config/docs/config.md.
schemaVersion: 1                 # required

selection:                       # required
  testSet: testsets/default_predefined.yaml   # required — relative to this file

run:                             # required: orderSeed
  inputSizes: [64, 1024, 16384]  # optional, default [1024] — bytes per call
  seed: 0                        # optional, default 0 — seeds the input bytes
  orderSeed: 20261115             # required — each process, device or host, shuffles the case order from (orderSeed, repetition)
  harness:
    iterations: 100              # optional — measurement samples per case

providers:                       # optional: the test set's BundledConscrypt and BundledBC rows
  bundled:
    - {artifact: 'org.conscrypt:conscrypt-android:2.9.0', create: 'org.conscrypt.Conscrypt#newProvider', alias: BundledConscrypt}
    - {artifact: 'org.bouncycastle:bcprov-jdk18on:1.87', create: org.bouncycastle.jce.provider.BouncyCastleProvider, alias: BundledBC}
