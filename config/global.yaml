schemaVersion: 1

selection:
  testSet: testsets/scope.yaml   # relative to this file
  exclude: []                    # applied after the test set; exclude always wins, e.g. {provider: BC}

run:
  inputSizes: [64, 1024, 16384]
  phases: [WARM]
  metrics: [TIME]
  processRepetitions: 1
  seed: 0
  harness:                       # the run's defaults; an entry states only what differs
    iterations: 50               # measurement samples per case (androidx.benchmark.iterations)
    warmupIterations: null       # null leaves warmup to the harness
    profiling: none              # none | MethodTracing | StackSampling

policy:
  onFailure: skip                # stop | skip — every stage; a broken config file always stops
