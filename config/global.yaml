# What a run measures. Everything not written here takes its default: every key is in apps/benchmark/modules/config/docs/config.md.
schemaVersion: 1                 # required

selection:                       # required
  testSet: testsets/scope.yaml   # required — relative to this file

run:                             # optional
  inputSizes: [64, 1024, 16384]  # optional, default [1024] — bytes per call
  seed: 0                        # optional, default 0 — seeds the input bytes
  harness:
    iterations: 100              # optional — measurement samples per case
