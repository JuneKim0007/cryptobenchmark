# Reference: every key global.yaml accepts, with its default and whether it is required.
# Nothing reads this file; copy a key into global.yaml only when the default is wrong for you.
schemaVersion: 1                 # required

selection:                       # required
  testSet: testsets/scope.yaml   # required — relative to the global file that names it
  exclude: []                    # optional, default [] — applied after the test set; exclude always wins, e.g. {provider: BC}

run:                             # optional — every key below falls back to its default
  inputSizes: [64, 1024, 16384]  # optional, default [1024] — bytes per call; one case per size (types that take no input ignore it)
  phases: [WARM]                 # optional, default [WARM] — WARM | COLD
  metrics: [TIME]                # optional, default [TIME] — TIME | ALLOCATION | CPU_EVENTS (rooted device); what benchmark.json reports, the device always runs its allocation phase
  variants: [fixed, notFixed]    # optional, default [fixed, notFixed] — each measured item once per variant: fixed keeps the setup the API lets a call keep (catalog in apps/benchmark/modules/preparation/docs/operations.md), notFixed makes getInstance + init every call; key generation has one variant
  processRepetitions: 1          # optional, default 1 — independent process runs
  isolation: case                # optional, default case — --device: case starts one process per measured case, so a crash loses that case only; run measures every case in one process
  seed: 0                        # optional, default 0 — seeds the input bytes
  passes: {}                     # optional, default {} — one pass measures every metric; else one device session per metric group, e.g.
  #   timing: {samples: 300}      # required when passes is set — TIME (and CPU_EVENTS); no energy capture; its rows are the base the others merge into
  #   energy: {samples: 100}      # optional — energy where a case captures measured; the window is the timed phase, so samples set its length
  #   allocation: {samples: 100}  # optional — ALLOCATION, one run per sample; needs ALLOCATION in metrics
  thermalThrottleSleepSeconds: null  # optional — --device: Jetpack's pause when it detects throttling (androidx.benchmark.thermalThrottle.sleepDurationSeconds); null keeps Jetpack's default (90)
  caseCooldownSeconds: 0         # optional, default 0 — --device: host sleep before every measured case but a session's first (between processes with isolation run)
  warmup:                        # optional — --device: a pre-flight run once per session, before the first pass; never measured
    iterations: 10               # optional, default 10 — samples each warm-up case takes; 0 turns it off
    jobs: []                     # optional, default [] = the plan's first 3 cases — test-set rules {provider?, type?, name?}
  thermalGate:                   # optional, default absent = off — --device: before each case process the host waits while the device is hotter than its idle baseline
    enabled: true                # optional, default true — false keeps the block but turns the gate off
    sensors: [BIG, MID, LITTLE]  # required when enabled — thermal HAL sensor names (device facts); these are the Pixel's CPU clusters; an absent one is skipped
    marginCelsius: 3             # optional, default 3 — target = hottest of sensors after the warm-up + margin
    pollSeconds: 5               # optional, default 5 — seconds between dumpsys reads while waiting
    timeoutSeconds: 300          # optional, default 300 — past it the case starts anyway, flagged thermal_gate_timeout
  scopedRepetitions: 3           # optional, default 3 — --harness: processes per side, before and after alternating (AB BA AB); 4 cancels linear drift exactly
  harness:                       # optional — the run's defaults; an entry states only what differs
    iterations: 50               # optional — timing samples per case; the device applies it per case (allocation is always 5 runs)
    warmupIterations: null       # optional — null leaves warmup to the harness; 0 is refused on a device, androidx needs at least 1
    profiling: none              # optional — none | MethodTracing | StackSampling
    energy:                      # optional — device runs only; semantics in docs/energy.md
      capture: none              # optional, default none — none | measured | dry
      windowSeconds: 10          # optional, default 10
      warmupSeconds: 2           # optional, default 2
      cooldownSeconds: 5         # optional, default 5
      source: rails              # optional, default rails — rails (measured) | manafa (estimated, tools/energy/requirements-manafa.txt)
    cpu:                         # optional — pin the measuring thread; checked against discovery/facts.yaml
      core: null                 # optional — a core index 0..63 or big
      required: false            # optional, default false — true makes an unmet pin fail config (a test-set entry: skip it)

policy:                          # optional
  onFailure: skip                # optional, default skip — stop | skip, every stage; a broken config file always stops

analysis:                        # optional — how results are summarised and drawn; not read by the measurement stages
  charts: [iqrBars, throughput, latency, stability]   # optional, default all four — name some to draw only those; [] writes the summary only
  dir: null                      # optional — null writes to <device folder>/chart/<run-id>; <run-id> may appear in a path you give
  statistic:                     # optional
    headline: auto               # optional, default auto — auto | median | mean. Which statistic leads in tables and charts; both are always computed
    meanUpToCovPercent: 5        # optional, default 5 — only read when headline is auto: the mean leads while a case's CoV (sample sd / mean) is within this many percent, the median above it
  units:                         # optional — display only: results stay ns/op and ratios unitless; recorded in manifest.yaml
    latency: ms                  # optional, default ms — ms | us | ns
    throughput: MB/s             # optional, default MB/s — MB/s (10^6 bytes) | MiB/s | ops/s; MB/s and MiB/s only where a case has an input size

providers:                       # optional — providers an app ships, measured beside the platform's (device runs)
  bundled: []                    # optional, default [] — each entry is built into the APK and appended after every platform provider, e.g.
  #   - artifact: org.conscrypt:conscrypt-android:2.5.3   # required — group:name:version, added as an implementation dependency
  #     create: org.conscrypt.Conscrypt#newProvider       # required — Class (public no-argument constructor) or Class#staticFactory
  #     alias: null                                       # optional — the registered name; required when the provider's own name is already installed
